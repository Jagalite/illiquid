name: Video recovery GOP lifetime

on:
  push:
    branches: ['perf/video-recovery-gop-eof-20261028-bc446']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegPacket.swift'
      - 'Sources/IlliquidNativePlayback/Media/MediaSession.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoRecoveryPacketLifetimeTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoRecoveryPacketSessionLifetimeTests.swift'
      - 'Benchmarks/VideoRecoveryPacketLifetime/**'
      - '.github/workflows/video-recovery-gop-lifetime.yml'
      - '!Benchmarks/VideoRecoveryPacketLifetime/*.md'
      - '!Benchmarks/VideoRecoveryPacketLifetime/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegPacket.swift'
      - 'Sources/IlliquidNativePlayback/Media/MediaSession.swift'
      - 'Sources/IlliquidNativePlayback/Media/VideoDecoder.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoRecoveryPacketLifetimeTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoRecoveryPacketSessionLifetimeTests.swift'
      - 'Benchmarks/VideoRecoveryPacketLifetime/**'
      - '.github/workflows/video-recovery-gop-lifetime.yml'
      - '!Benchmarks/VideoRecoveryPacketLifetime/*.md'
      - '!Benchmarks/VideoRecoveryPacketLifetime/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-recovery-gop-lifetime-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: true

jobs:
  portable-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the pinned native ownership dependencies
        run: |
          echo 'Shared Kyoto queue is unavailable on this hosted runner; building serially in this isolated checkout.'
          swiftc --version
          bash Benchmarks/DeinterlacerEOFMemory/build-linux-ffmpeg.sh "$RUNNER_TEMP/recovery-ffmpeg"
      - name: Verify real packet lifetime in debug and release
        run: |
          python3 Benchmarks/VideoRecoveryPacketLifetime/run.py \
            --ffmpeg-prefix "$RUNNER_TEMP/recovery-ffmpeg" \
            --output "$RUNNER_TEMP/recovery-lifetime"
      - name: Emit reproducible ownership evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'recovery-lifetime'
          files = {}
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if path.is_file() and 'build' not in relative.parts:
                  files[str(relative)] = path.read_text()
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          print('RECOVERY_GOP_EVIDENCE_SHA256 ' + hashlib.sha256(packed).hexdigest())
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds inline limit; use the artifact')
          print('RECOVERY_GOP_EVIDENCE_BASE64 ' + base64.b64encode(packed).decode())
          if 'summary.json' in files:
              print(files['summary.json'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-recovery-gop-portable
          path: |
            ${{ runner.temp }}/recovery-lifetime/
            !${{ runner.temp }}/recovery-lifetime/build/**
            ${{ runner.temp }}/recovery-ffmpeg/*receipt.json
            ${{ runner.temp }}/recovery-ffmpeg/*.log
          retention-days: 14

  macos-integration:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ILLIQUID_RECOVERY_PACKET_REQUIRE_FIXTURE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the pinned native SDK
        run: |
          echo 'Shared Kyoto queue is unavailable on this hosted runner; building serially in this isolated checkout.'
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate and verify the native B-frame EOF fixture
        run: |
          python3 Benchmarks/FrameStepTimestamps/generate-fixtures.py \
            --output "$RUNNER_TEMP/recovery-native/fixtures"
      - name: Build the application graph and test packet recovery lifetime
        env:
          ILLIQUID_NATIVE_FIXTURE_DIR: ${{ runner.temp }}/recovery-native/fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-native"
          sw_vers > "$RUNNER_TEMP/recovery-native/host.txt"
          swift --version >> "$RUNNER_TEMP/recovery-native/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/recovery-native/host.txt"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'VideoRecoveryPacketLifetimeTests|VideoRecoveryPacketSessionLifetimeTests|PlaybackBufferRegressionTests|PacketOwnershipTests' \
            2>&1 | tee "$RUNNER_TEMP/recovery-native/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-recovery-gop-native
          path: ${{ runner.temp }}/recovery-native/
          retention-days: 14
