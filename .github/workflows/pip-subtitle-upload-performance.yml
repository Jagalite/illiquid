name: PiP subtitle upload performance

on:
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/PiPSubtitleCompositor.swift'
      - 'Sources/IlliquidNativePlayback/Presentation/PiPSubtitleUploadCache.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/MetalASSSubtitleCompositor.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/SubtitlePipeline.swift'
      - 'Sources/IlliquidNativePlayback/Resources/NativePlaybackShaders.metal'
      - 'Tests/IlliquidNativePlaybackTests/PiPSubtitleUploadReuseTests.swift'
      - 'Benchmarks/PiPSubtitleUpload/**'
      - '.github/workflows/pip-subtitle-upload-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-subtitle-upload-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metal-upload-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure the native Metal compiler is available
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Compare exact upload implementations on native Metal
        run: |
          python3 Benchmarks/PiPSubtitleUpload/run.py \
            --output "$RUNNER_TEMP/pip-subtitle-upload"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pip-subtitle-upload-component
          path: ${{ runner.temp }}/pip-subtitle-upload/
          retention-days: 14

  native-subtitle-regressions:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build app graph and verify PiP pixels and subtitle consumers
        run: |
          mkdir -p "$RUNNER_TEMP/pip-subtitle-regressions"
          set -o pipefail
          swift test --force-resolved-versions -c release --no-parallel --filter \
            'PiPSubtitleUploadReuseTests|PiPSubtitlePipelineTests|PiPVideoMappingTests|PiPSubtitleCompositionPolicyTests|MetalASSSubtitleCompositorTests' \
            2>&1 | tee "$RUNNER_TEMP/pip-subtitle-regressions/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pip-subtitle-native-regressions
          path: ${{ runner.temp }}/pip-subtitle-regressions/
          retention-days: 14
