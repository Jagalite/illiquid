name: Queue notification alternate macOS validation

on:
  push:
    branches: [perf/queue-notifications-validation-20261028]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  queue-intel:
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check build coordination and compiler
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in isolated packages.'
          swift --version
          sw_vers
          uname -m
          git rev-parse HEAD
          git hash-object Sources/IlliquidNativePlayback/Playback/PacketQueue.swift Tests/IlliquidNativePlaybackTests/QueueNotificationTests.swift Tests/IlliquidNativePlaybackTests/PacketQueueWakeupTests.swift Scripts/test-queue-notifications.sh
      - name: Verify candidate in debug and release
        run: |
          bash Scripts/test-queue-notifications.sh --jobs 2 -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/queue-tests-debug.log"
          bash Scripts/test-queue-notifications.sh --jobs 2 -c release -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/queue-tests-release.log"
      - name: Verify frozen baseline
        run: |
          ILLIQUID_PACKET_QUEUE_SOURCE="$PWD/Benchmarks/QueueNotifications/baseline/PacketQueue.swift" \
            bash Scripts/test-queue-notifications.sh --jobs 2 -c release -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/queue-tests-baseline.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: queue-notifications-intel-validation
          path: ${{ runner.temp }}/queue-tests-*.log
          retention-days: 14
