name: Media read-ahead wakeup performance
on:
  push:
    branches: ['perf/subtitle-read-ahead-wakeups']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/MediaReadAheadGate.swift'
      - 'Tests/IlliquidNativePlaybackTests/MediaReadAheadGateTests.swift'
      - 'Benchmarks/MediaReadAheadGate/**'
      - '.github/workflows/media-read-ahead-performance.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/MediaReadAheadGate.swift'
      - 'Tests/IlliquidNativePlaybackTests/MediaReadAheadGateTests.swift'
      - 'Benchmarks/MediaReadAheadGate/**'
      - '.github/workflows/media-read-ahead-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-read-ahead-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test baseline and candidate and measure real reader threads
        run: |
          python3 Benchmarks/MediaReadAheadGate/run.py all --pairs 6 --output "$RUNNER_TEMP/media-read-ahead"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: media-read-ahead-native
          path: |
            ${{ runner.temp }}/media-read-ahead/*.json
            ${{ runner.temp }}/media-read-ahead/*.jsonl
            ${{ runner.temp }}/media-read-ahead/*.log
          retention-days: 14
