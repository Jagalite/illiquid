name: Startup snapshot lifetime

on:
  pull_request:
    paths:
      - 'Sources/IlliquidApp/App/AppModel.swift'
      - 'Sources/IlliquidApp/App/ReadOnlyStartupLoader.swift'
      - 'Sources/IlliquidApp/App/SourceStartupSnapshot.swift'
      - 'Tests/IlliquidAppTests/ReadOnlyStartupLoaderTests.swift'
      - 'Tests/IlliquidAppTests/SourceStartupSnapshotTests.swift'
      - 'Scripts/test-startup-loader-regressions.sh'
      - 'Benchmarks/StartupSnapshotLifetime/**'
      - '.github/workflows/startup-snapshot-lifetime.yml'
      - '!Benchmarks/StartupSnapshotLifetime/*.md'
      - '!Benchmarks/StartupSnapshotLifetime/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-snapshot-lifetime-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-startup:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      STARTUP_BASELINE: ${{ github.event.pull_request.base.sha || '6f70cd2446fc6ef38d4e5a0fbf96f91b2234e635' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Explain hosted build coordination
        run: |
          echo 'The shared local Kyoto queue is unavailable on this ephemeral hosted runner.'
          echo 'Compiler steps run sequentially within this isolated job.'
      - name: Verify coalescing, shutdown, and reference lifetimes
        run: |
          mkdir -p "$RUNNER_TEMP/startup-snapshot-lifetime"
          set -o pipefail
          for configuration in debug release; do
            bash Scripts/test-startup-loader-regressions.sh \
              --configuration "$configuration" --jobs 2 -Xswiftc -warnings-as-errors \
              2>&1 | tee "$RUNNER_TEMP/startup-snapshot-lifetime/$configuration.log"
          done
      - name: Measure native startup snapshot ownership
        run: |
          python3 Benchmarks/StartupSnapshotLifetime/run.py \
            --baseline "$STARTUP_BASELINE" --pairs 4 \
            --output "$RUNNER_TEMP/startup-snapshot-lifetime/benchmark"
      - name: Prepare the pinned native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the application graph and run startup regression tests
        run: |
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'ReadOnlyStartupLoaderTests|SourceStartupSnapshotTests' \
            2>&1 | tee "$RUNNER_TEMP/startup-snapshot-lifetime/app-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: startup-snapshot-lifetime-native
          path: |
            ${{ runner.temp }}/startup-snapshot-lifetime/**/*.json
            ${{ runner.temp }}/startup-snapshot-lifetime/**/*.jsonl
            ${{ runner.temp }}/startup-snapshot-lifetime/**/*.log
          retention-days: 14
