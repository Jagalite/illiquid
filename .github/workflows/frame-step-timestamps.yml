name: Frame step timestamp discovery

on:
  push:
    branches: ['perf/frame-step-timestamps']
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/VideoDecoder.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeFrameStepReader.swift'
      - 'Sources/IlliquidNativePlayback/Media/VideoDeinterlacer.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoTimestampDiscoveryTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/FrameStepPerformanceTests.swift'
      - 'Benchmarks/FrameStepTimestamps/**'
      - '.github/workflows/frame-step-timestamps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-step-timestamps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-research:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate deterministic timestamp fixtures
        run: |
          python3 Benchmarks/FrameStepTimestamps/generate-fixtures.py \
            --output "$RUNNER_TEMP/frame-step-fixtures"
      - name: Test decoder timestamp parity and frame-step adjacency
        env:
          ILLIQUID_FRAME_STEP_FIXTURE_DIR: ${{ runner.temp }}/frame-step-fixtures
          ILLIQUID_FRAME_STEP_REQUIRE_FIXTURES: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/frame-step-qualification"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'VideoTimestampDiscoveryTests|NativePlaybackFoundationTests|VideoDeinterlacerTests|SeekPrerollDecodeTests' \
            2>&1 | tee "$RUNNER_TEMP/frame-step-qualification/tests.log"
      - name: Measure baseline and candidate on the same native runner
        run: |
          python3 Benchmarks/FrameStepTimestamps/run.py \
            --output "$RUNNER_TEMP/frame-step-results" \
            --fixtures "$RUNNER_TEMP/frame-step-fixtures" \
            --pairs 6 --iterations 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frame-step-timestamp-research
          path: |
            ${{ runner.temp }}/frame-step-qualification/
            ${{ runner.temp }}/frame-step-results/*.json
            ${{ runner.temp }}/frame-step-results/*.jsonl
            ${{ runner.temp }}/frame-step-results/*.log
            ${{ runner.temp }}/frame-step-fixtures/*.json
            ${{ runner.temp }}/frame-step-fixtures/*.log
          retention-days: 14
