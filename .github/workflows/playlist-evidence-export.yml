name: Preserve playlist research evidence

on:
  push:
    branches: ['perf/playlist-identity-lookup']
    paths: ['.github/workflows/playlist-evidence-export.yml']

permissions:
  actions: read
  contents: read

jobs:
  export-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and export existing native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, urllib.error, urllib.request, zipfile

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def download(artifact_id, expected):
              url = f"https://api.github.com/repos/Jagalite/illiquid/actions/artifacts/{artifact_id}/zip"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=30) as response:
                      data = response.read()
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise
                  with urllib.request.urlopen(error.headers["Location"], timeout=30) as response:
                      data = response.read()
              assert hashlib.sha256(data).hexdigest() == expected
              return data

          final = download(12114929075, "8d1295d19c6d1ccec65c12217e20cf5d59123d8f4e68f2210e76db940000bad7")
          print("EVIDENCE_METADATA " + json.dumps({"bytes":len(final), "sha256":hashlib.sha256(final).hexdigest()}))
          encoded = base64.b64encode(final).decode("ascii")
          for number, offset in enumerate(range(0, len(encoded), 16384)):
              print(f"EVIDENCE_BASE64_CHUNK {number} {encoded[offset:offset+16384]}")
          with zipfile.ZipFile(io.BytesIO(final)) as archive:
              print("EVIDENCE_FINAL_MANIFEST " + json.dumps(json.loads(archive.read("manifest.json"))))
              print("EVIDENCE_FINAL_SUMMARY " + json.dumps(json.loads(archive.read("summary.json"))))
          initial = download(12115295859, "5f742a028d04f0843a462b6178818338ae775d6c3e2fb8f81e128da42c73677b")
          with zipfile.ZipFile(io.BytesIO(initial)) as archive:
              print("EVIDENCE_INITIAL_SUMMARY " + json.dumps(json.loads(archive.read("summary.json"))))
