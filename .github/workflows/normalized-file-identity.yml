name: Normalized file identity portable probe

on:
  push:
    branches: ['perf/identity-portable-probe-20261028-6ef890ad']
    paths:
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Tests/IlliquidCoreTests/NormalizedFileIdentityTests.swift'
      - 'Benchmarks/NormalizedFileIdentity/**'
      - '.github/workflows/normalized-file-identity.yml'
      - '!Benchmarks/NormalizedFileIdentity/*.md'
      - '!Benchmarks/NormalizedFileIdentity/evidence/**'
permissions:
  contents: read

concurrency:
  group: normalized-file-identity-portable-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  portable-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the hosted Swift toolchain is at least 6.1
        run: |
          python3 - <<'PY'
          import re, subprocess
          for executable in ('swift', 'swiftc'):
              version = subprocess.check_output([executable, '--version'], text=True)
              print(version, end='')
              match = re.search(r'\bSwift version (\d+)\.(\d+)', version)
              if not match or tuple(map(int, match.groups())) < (6, 1):
                  raise SystemExit(f'{executable} must be Swift 6.1 or newer')
          PY
      - name: Test exact path compatibility and measure paired playlist operations
        run: |
          python3 Benchmarks/NormalizedFileIdentity/run.py \
            --output "$RUNNER_TEMP/normalized-file-identity" --pairs 10 --target-ms 150
      - name: Diagnose unsupported relative URL fixtures
        if: failure()
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          source = Path('Tests/IlliquidCoreTests/NormalizedFileIdentityTests.swift').read_text()
          start = source.index('    @Test func relativeReferencesQueriesAndAuthoritiesKeepTheirIdentity()')
          stop = source.index('    @Test func ', start + 1)
          test = source[start:stop]
          declarations = []
          for name in ('bases', 'references'):
              match = re.search(rf'        let {name} = \[\n.*?\n        \]', test, re.S)
              if not match:
                  raise RuntimeError(f'Cannot find exact {name} test fixtures')
              declarations.append(match.group(0))
          program = 'import Foundation\n' + '\n'.join(declarations) + r'''
          var tested = 0
          var rejected = 0
          for baseText in bases {
              guard let base = URL(string: baseText) else {
                  fatalError("Base cannot be constructed: \(baseText)")
              }
              for reference in references {
                  tested += 1
                  guard URL(string: reference, relativeTo: base) == nil else { continue }
                  rejected += 1
                  let record: [String: Any] = [
                      "base": baseText,
                      "reference": reference,
                      "constructible": false,
                  ]
                  let data = try JSONSerialization.data(withJSONObject: record, options: [.sortedKeys])
                  print("FILE_IDENTITY_URL_CONSTRUCTOR " + String(decoding: data, as: UTF8.self))
              }
          }
          print("FILE_IDENTITY_URL_CONSTRUCTOR_SUMMARY tested=\(tested) rejected=\(rejected)")
          '''
          subprocess.run(['swift', '-'], input=program, text=True, check=True)
          PY
      - name: Emit durable measurement receipts
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'normalized-file-identity'
          paths = sorted(root.glob('*.json')) + sorted(root.glob('*.jsonl'))
          paths += sorted((root / 'logs').glob('tests-*.log'))
          for path in paths:
              value = path.read_text()
              truncated = path.suffix == '.log' and len(value) > 20000
              if truncated: value = value[-20000:]
              print('FILE_IDENTITY_EVIDENCE ' + json.dumps({
                  'path': str(path.relative_to(root)), 'text': value, 'truncated': truncated
              }, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normalized-file-identity-portable
          path: |
            ${{ runner.temp }}/normalized-file-identity/*.json
            ${{ runner.temp }}/normalized-file-identity/*.jsonl
            ${{ runner.temp }}/normalized-file-identity/logs/
            ${{ runner.temp }}/normalized-file-identity/*/Sources/
            ${{ runner.temp }}/normalized-file-identity/*/Tests/
          retention-days: 14
