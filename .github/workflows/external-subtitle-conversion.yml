name: External subtitle conversion performance
on:
  push:
    branches: ['perf/subtitle-timestamp-fast-path-20261028']
    paths:
      - 'Sources/IlliquidNativePlayback/Subtitles/ExternalTextSubtitleConverter.swift'
      - 'Tests/IlliquidNativePlaybackTests/External*Subtitle*Tests.swift'
      - 'Benchmarks/ExternalSubtitleConversion/Driver.swift'
      - 'Benchmarks/ExternalSubtitleConversion/run.py'
      - '.github/workflows/external-subtitle-conversion.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Subtitles/ExternalTextSubtitleConverter.swift'
      - 'Tests/IlliquidNativePlaybackTests/External*Subtitle*Tests.swift'
      - 'Scripts/test-external-subtitle-regressions.sh'
      - 'Benchmarks/ExternalSubtitleConversion/**'
      - 'Benchmarks/ExternalSubtitleMemory/**'
      - '.github/workflows/external-subtitle-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-subtitle-conversion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BASELINE_REF: ${{ github.event.pull_request.base.sha || 'ea2ff568237e2667f7b1aeee67b11a44ebe95b72' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check converter behavior in debug and release
        run: |
          bash Scripts/test-external-subtitle-regressions.sh -c debug -Xswiftc -warnings-as-errors
          bash Scripts/test-external-subtitle-regressions.sh -c release -Xswiftc -warnings-as-errors
      - name: Compare native Foundation output and paired conversion timings
        run: >-
          python3 Benchmarks/ExternalSubtitleConversion/run.py benchmark
          --rounds 10 --target-ms 100 --baseline-ref "$BASELINE_REF"
          --output "$RUNNER_TEMP/external-subtitle-conversion"
      - name: Compare fresh-process conversion peak memory
        run: >-
          python3 Benchmarks/ExternalSubtitleMemory/run.py benchmark
          --swiftc "$(xcrun --find swiftc)"
          --rounds 4
          --output "$RUNNER_TEMP/external-subtitle-conversion/memory"
      - name: Compare ignored WebVTT comments against the pre-change converter
        run: |
          git fetch --no-tags --depth=1 origin ea2ff568237e2667f7b1aeee67b11a44ebe95b72
          python3 Benchmarks/ExternalSubtitleMemory/run.py benchmark \
            --swiftc "$(xcrun --find swiftc)" \
            --baseline-ref ea2ff568237e2667f7b1aeee67b11a44ebe95b72 \
            --rounds 4 --case vtt-note-512k --case vtt-note-8m \
            --case vtt-note-near-limit --case vtt-note-only \
            --case vtt-note-interleaved --case vtt-note-control \
            --case vtt-2000 --case srt-2000 \
            --output "$RUNNER_TEMP/external-subtitle-conversion/notes"
      - name: Emit reproducible conversion timing evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'external-subtitle-conversion'
          names = ['manifest.json', 'benchmark.json', 'calibration.json',
                   'summary.json', 'measurements.jsonl']
          files = {name: (root / name).read_text() for name in names if (root / name).is_file()}
          for name, content in files.items():
              for number, line in enumerate(content.splitlines()):
                  print('TIMESTAMP_EVIDENCE_LINE ' + json.dumps(
                      {'file': name, 'line': number, 'text': line}, sort_keys=True))
          verification = root / 'verification.json'
          if verification.is_file():
              print('TIMESTAMP_VERIFICATION_CASES ' + str(len(json.loads(verification.read_text()))))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-subtitle-conversion-native
          path: |
            ${{ runner.temp }}/external-subtitle-conversion/**/*.json
            ${{ runner.temp }}/external-subtitle-conversion/**/*.jsonl
            ${{ runner.temp }}/external-subtitle-conversion/**/*.gz
            ${{ runner.temp }}/external-subtitle-conversion/**/*.log
            ${{ runner.temp }}/external-subtitle-conversion/**/*.swift
            ${{ runner.temp }}/external-subtitle-conversion/runner.snapshot.py
          retention-days: 14
