name: Video color sampling performance

on:
  push:
    branches: ['perf/video-color-sampling-*']
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/VideoFrameColorSampler.swift'
      - 'Sources/IlliquidNativePlayback/Presentation/PiPVideoMapping.swift'
      - 'Sources/IlliquidCore/Player/VideoColorSample.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoFrameColorSamplerTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PiPVideoMappingTests.swift'
      - 'Benchmarks/VideoColorSampling/*.swift'
      - 'Benchmarks/VideoColorSampling/*.py'
      - '.github/workflows/video-color-sampling.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/VideoFrameColorSampler.swift'
      - 'Sources/IlliquidNativePlayback/Presentation/PiPVideoMapping.swift'
      - 'Sources/IlliquidCore/Player/VideoColorSample.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoFrameColorSamplerTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PiPVideoMappingTests.swift'
      - 'Benchmarks/VideoColorSampling/*.swift'
      - 'Benchmarks/VideoColorSampling/*.py'
      - '.github/workflows/video-color-sampling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-color-sampling-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare exact sample output and measure paired native processes
        # The runner routes its compiler invocations through Kyoto when present.
        run: >-
          python3 Benchmarks/VideoColorSampling/run.py
          --output "$RUNNER_TEMP/video-color-sampling"
          --pairs 8 --target-ms 200
      - name: Print compact result receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'video-color-sampling'
          for name in ['environment.json', 'parity.json', 'summary.json', 'completion.json']:
              path = root / name
              if path.is_file():
                  print(f'::group::{name}')
                  print(path.read_text())
                  print('::endgroup::')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-color-sampling-native-component
          path: |
            ${{ runner.temp }}/video-color-sampling/**/*.json
            ${{ runner.temp }}/video-color-sampling/**/*.jsonl
            ${{ runner.temp }}/video-color-sampling/**/*.json.gz
            ${{ runner.temp }}/video-color-sampling/**/*.log
            ${{ runner.temp }}/video-color-sampling/**/*.txt
            ${{ runner.temp }}/video-color-sampling/sources/**/*.swift
            ${{ runner.temp }}/video-color-sampling/sources/*.swift
            ${{ runner.temp }}/video-color-sampling/sources/*.py
            !${{ runner.temp }}/video-color-sampling/**/module-cache/**
            !${{ runner.temp }}/video-color-sampling/**/.build/**
          retention-days: 14

  native-app-regressions:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and test sampling, mapping, and color publication
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'video-color-sampling-native'
          root.mkdir(parents=True, exist_ok=False)
          selected = '|'.join([
              'VideoFrameColorSamplerTests', 'PiPVideoMappingTests',
              'AdaptiveRainbowTextColorTests', 'AdaptiveTextLegibilityTests',
              'disablingVideoColorSamplingResetsPublishedColor',
              'samplesOnlyForDynamicLiquidGlassText',
          ])
          command = ['swift', 'test', '--force-resolved-versions', '-c', 'release',
                     '--jobs', '2', '--no-parallel', '--filter', selected]
          environment = {
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'macos': subprocess.check_output(['sw_vers'], text=True),
              'host': subprocess.check_output(['uname', '-a'], text=True).strip(),
              'compiler': subprocess.check_output(['swift', '--version'], text=True).strip(),
              'native_sdk_manifest_sha256': hashlib.sha256(
                  Path('BuildInputs/native-sdk.json').read_bytes()).hexdigest(),
              'command': command,
          }
          (root / 'environment.json').write_text(json.dumps(environment, indent=2) + '\n')
          queue = Path('/Volumes/seed1/Projects/kyoto/kyoto.py')
          log_path = root / 'native-tests.log'
          if queue.is_file():
              cli = [sys.executable, str(queue)]
              submitted = subprocess.check_output([*cli, 'submit', '--', *command], text=True)
              print(submitted, flush=True)
              (root / 'kyoto-submit.json').write_text(submitted)
              job_id = str(json.loads(submitted)['id'])
              with (root / 'kyoto-show.log').open('w') as log:
                  subprocess.run([*cli, 'show', job_id], stdout=log,
                                 stderr=subprocess.STDOUT, check=True)
              with (root / 'kyoto-wait.log').open('w') as log:
                  result = subprocess.run([*cli, 'wait', job_id], stdout=log,
                                          stderr=subprocess.STDOUT)
              with log_path.open('w') as log:
                  subprocess.run([*cli, 'logs', job_id], stdout=log,
                                 stderr=subprocess.STDOUT, check=True)
          else:
              print('The shared Kyoto queue is unavailable on this hosted runner; '
                    'building and testing serially in this isolated checkout.', flush=True)
              with log_path.open('w') as log:
                  result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          output = log_path.read_text()
          print(output[-24000:], flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          completed = re.search(r'Test run with (\d+) tests?(?: in \d+ suites?)? passed', output)
          if not completed or int(completed.group(1)) == 0:
              raise SystemExit('Native execution did not report a nonzero completed test count')
          expected = [
              'throttlesSamplingToFourTimesPerSecond',
              'rotationAndMirroringMapAsymmetricCorners',
              'sampledVideoColorReportsSRGBRelativeLuminance',
              'adaptiveTextRefreshesAcrossBrightDarkCutsAndReset',
              'disablingVideoColorSamplingResetsPublishedColor',
              'samplesOnlyForDynamicLiquidGlassText',
          ]
          for name in expected:
              if not re.search(r'Test ' + re.escape(name) + r'\(\).* passed', output):
                  raise SystemExit(f'Expected passing native test receipt is missing: {name}')
          (root / 'completion.json').write_text(json.dumps({
              'status': 'passed', 'completed_test_functions': int(completed.group(1)),
              'filter': selected, 'required_tests': expected, 'ui_qualified': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-color-sampling-native-app
          path: ${{ runner.temp }}/video-color-sampling-native/
          retention-days: 14
