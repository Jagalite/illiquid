name: PCM sanitization performance

on:
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/AudioDecoder.swift'
      - 'Tests/IlliquidNativePlaybackTests/AudioSampleSanitizationTests.swift'
      - 'Benchmarks/PCMSanitization/run.py'
      - 'Benchmarks/PCMSanitization/Harness.swift'
      - '.github/workflows/pcm-sanitization-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcm-sanitization-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # The experiment extracts the exact scalar implementation at its
          # pinned baseline, including when a PR is tested as a merge commit.
          fetch-depth: 0
      - name: Record native host
        run: |
          mkdir -p "$RUNNER_TEMP/pcm-component"
          sw_vers > "$RUNNER_TEMP/pcm-component/host.txt"
          uname -a >> "$RUNNER_TEMP/pcm-component/host.txt"
          sysctl -n machdep.cpu.brand_string >> "$RUNNER_TEMP/pcm-component/host.txt"
          swift --version >> "$RUNNER_TEMP/pcm-component/host.txt"
      - name: Test both implementations and measure paired native runs
        run: |
          python3 Benchmarks/PCMSanitization/run.py \
            --mode all --test-variant both --test-configuration both \
            --pairs 6 --target-ms 80 \
            --output "$RUNNER_TEMP/pcm-component/results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcm-sanitization-component
          path: |
            ${{ runner.temp }}/pcm-component/
            !${{ runner.temp }}/pcm-component/results/module-cache/**
            !${{ runner.temp }}/pcm-component/results/tests-*/build/**
            !${{ runner.temp }}/pcm-component/results/tests-*/cache/**
          retention-days: 14

  native-audio:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and run audio regressions
        run: |
          mkdir -p "$RUNNER_TEMP/pcm-native-audio"
          set -o pipefail
          swift test --force-resolved-versions --filter \
            'AudioSampleSanitizationTests|AudioResamplerDrainTests|MultichannelAudioTests|AudioDelayTests|NativePlaybackFoundationTests.audioSanitizationZerosInvalidSamplesOnly' \
            2>&1 | tee "$RUNNER_TEMP/pcm-native-audio/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pcm-sanitization-native-audio
          path: ${{ runner.temp }}/pcm-native-audio/
          retention-days: 14
