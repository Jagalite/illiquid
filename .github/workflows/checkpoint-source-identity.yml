name: Checkpoint source identity research

on:
  push:
    branches: [perf/checkpoint-source-identity-20261028]
    paths:
      - Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift
      - Tests/IlliquidPlayerTests/PlaybackCheckpointWriterTests.swift
      - Benchmarks/CheckpointSourceIdentity/Driver.swift
      - Benchmarks/CheckpointSourceIdentity/run.py
      - .github/workflows/checkpoint-source-identity.yml
  pull_request:
    paths:
      - Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift
      - Sources/IlliquidCore/Playlist/FolderPlaylist.swift
      - Sources/IlliquidCore/Playlist/PlaylistMutation.swift
      - Sources/IlliquidCore/Utilities/NormalizedFileURL.swift
      - Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift
      - Sources/IlliquidCore/Player/MediaSource.swift
      - Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift
      - Tests/IlliquidPlayerTests/PlaybackCheckpointWriterTests.swift
      - Benchmarks/CheckpointSourceIdentity/Driver.swift
      - Benchmarks/CheckpointSourceIdentity/run.py
      - .github/workflows/checkpoint-source-identity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-source-identity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-component:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    timeout-minutes: 20
    steps:
      - name: Prepare Python runner and repository ownership
        shell: bash
        run: |
          if ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch pinned baseline
        run: git fetch --no-tags --depth=1 origin ea2ff568237e2667f7b1aeee67b11a44ebe95b72
      - name: Test and compare complete checkpoint construction
        shell: bash
        run: |
          python3 Benchmarks/CheckpointSourceIdentity/run.py \
            --output "$RUNNER_TEMP/checkpoint-source-identity" \
            --pairs 6 --target-ms 150 ${{ github.event_name == 'pull_request' && '--tests-only' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-source-identity-linux
          path: ${{ runner.temp }}/checkpoint-source-identity/
          retention-days: 14

  macos-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch pinned baseline
        run: git fetch --no-tags --depth=1 origin ea2ff568237e2667f7b1aeee67b11a44ebe95b72
      - name: Test and compare native Foundation checkpoint construction
        shell: bash
        run: |
          python3 Benchmarks/CheckpointSourceIdentity/run.py \
            --output "$RUNNER_TEMP/checkpoint-source-identity" \
            --pairs 6 --target-ms 150 ${{ github.event_name == 'pull_request' && '--tests-only' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-source-identity-macos
          path: ${{ runner.temp }}/checkpoint-source-identity/
          retention-days: 14

  native-app-regressions:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build native app graph and run checkpoint and coordinator regressions
        shell: bash
        run: |
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'PlaybackCheckpointWriterTests|PlaybackCheckpointTests|PlaybackCoordinatorTests' \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-app-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-source-identity-app-tests
          path: ${{ runner.temp }}/checkpoint-app-tests.log
          retention-days: 14
