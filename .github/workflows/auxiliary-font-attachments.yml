name: Auxiliary input font memory

on:
  push:
    branches: ['perf/auxiliary-font-payloads-20261023']
    paths:
      - 'Sources/IlliquidNativePlayback/**'
      - 'Tests/IlliquidNativePlaybackTests/AuxiliaryFontAttachmentTests.swift'
      - 'Benchmarks/AuxiliaryFontAttachments/**'
      - 'Benchmarks/AttachmentAdmission/run.py'
      - 'Benchmarks/AttachmentAdmission/audit-results.py'
      - 'Benchmarks/SubtitleResultLifetime/run.py'
      - 'Benchmarks/SubtitleResultLifetime/baseline/manifest.json'
      - '.github/workflows/auxiliary-font-attachments.yml'
      - '!Benchmarks/AuxiliaryFontAttachments/*.md'
      - '!Benchmarks/AuxiliaryFontAttachments/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegDemuxer.swift'
      - 'Sources/IlliquidNativePlayback/Media/FFmpegInputExecutor.swift'
      - 'Sources/IlliquidNativePlayback/Media/MediaSession.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeFrameStepReader.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeThumbnailMetadataReader.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeTimelineThumbnailGenerator.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/PreparedExternalSubtitle.swift'
      - 'Tests/IlliquidNativePlaybackTests/AuxiliaryFontAttachmentTests.swift'
      - 'Benchmarks/AuxiliaryFontAttachments/**'
      - '.github/workflows/auxiliary-font-attachments.yml'
      - '!Benchmarks/AuxiliaryFontAttachments/*.md'
      - '!Benchmarks/AuxiliaryFontAttachments/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auxiliary-font-attachments-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-memory:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate font and control fixtures
        run: |
          python3 Benchmarks/AuxiliaryFontAttachments/generate-fixtures.py \
            --output "$RUNNER_TEMP/auxiliary-font-fixtures"
      - name: Measure retained input memory and verify packet parity
        run: |
          python3 Benchmarks/AuxiliaryFontAttachments/run.py \
            --fixtures "$RUNNER_TEMP/auxiliary-font-fixtures" \
            --output "$RUNNER_TEMP/auxiliary-font-results" --pairs 6
      - name: Emit reviewable native evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'auxiliary-font-results'
          files = {}
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if (path.is_file() and path.suffix in {'.json', '.jsonl', '.log', '.txt'}
                      and not any(part in {'sources', 'module-cache', 'cache', '.build'} for part in relative.parts)):
                  files[str(relative)] = path.read_text()
          fixtures = Path(os.environ['RUNNER_TEMP']) / 'auxiliary-font-fixtures'
          for name in ['manifest.json', 'fixture-commands.json', 'integration-fixtures.json']:
              path = fixtures / name
              if path.is_file():
                  files['fixtures/' + name] = path.read_text()
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds log limit; use uploaded artifact')
          print('AUXILIARY_FONT_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('AUXILIARY_FONT_BASE64 ' + base64.b64encode(packed).decode())
          for name in ['summary.json', 'completion.json']:
              if name in files:
                  print(name + '\n' + files[name])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auxiliary-font-memory
          path: |
            ${{ runner.temp }}/auxiliary-font-results/
            ${{ runner.temp }}/auxiliary-font-fixtures/manifest.json
            ${{ runner.temp }}/auxiliary-font-fixtures/fixture-commands.json
            ${{ runner.temp }}/auxiliary-font-fixtures/integration-fixtures.json
            !${{ runner.temp }}/auxiliary-font-results/**/module-cache/**
          retention-days: 14

  native-regressions:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate required integration fixtures
        run: |
          python3 Benchmarks/AuxiliaryFontAttachments/generate-fixtures.py \
            --output "$RUNNER_TEMP/auxiliary-font-fixtures"
          test -s "$RUNNER_TEMP/auxiliary-font-fixtures/attachment-admission.mkv"
          test -s "$RUNNER_TEMP/auxiliary-font-fixtures/auxiliary-font-video.mkv"
      - name: Build application graph and qualify reader ownership
        env:
          ILLIQUID_ATTACHMENT_ADMISSION_FIXTURE: ${{ runner.temp }}/auxiliary-font-fixtures/attachment-admission.mkv
          ILLIQUID_AUXILIARY_FONT_VIDEO_FIXTURE: ${{ runner.temp }}/auxiliary-font-fixtures/auxiliary-font-video.mkv
        run: |
          mkdir -p "$RUNNER_TEMP/auxiliary-font-tests"
          sw_vers > "$RUNNER_TEMP/auxiliary-font-tests/host.txt"
          swift --version >> "$RUNNER_TEMP/auxiliary-font-tests/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/auxiliary-font-tests/host.txt"
          cp "$RUNNER_TEMP/auxiliary-font-fixtures/integration-fixtures.json" \
            "$RUNNER_TEMP/auxiliary-font-tests/fixtures.json"
          python3 Benchmarks/SubtitleResultLifetime/run.py --validate-inputs
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'AuxiliaryFontAttachmentTests|FontAttachmentAdmissionTests|NativePlaybackFoundationTests|InputReadFailureTests' \
            2>&1 | tee "$RUNNER_TEMP/auxiliary-font-tests/native-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auxiliary-font-regressions
          path: ${{ runner.temp }}/auxiliary-font-tests/
          retention-days: 14
