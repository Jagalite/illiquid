name: Thumbnail playlist neighbors portable

on:
  push:
    branches: ['perf/thumbnail-playlist-neighbors-20261028']
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighbors.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborsTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighbors/Harness.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighbors/run.py'
      - '.github/workflows/thumbnail-playlist-neighbors-portable.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighbors.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Sources/IlliquidCore/Player/ThumbnailPolicy.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborsTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighbors/Harness.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighbors/run.py'
      - '.github/workflows/thumbnail-playlist-neighbors-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnail-playlist-neighbors-portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Supplemental component evidence. The macOS workflow qualifies the app platform.
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify portable Swift semantics and measure paired runs
        run: |
          mode=()
          if test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            mode+=(--tests-only)
          fi
          python3 Benchmarks/ThumbnailPlaylistNeighbors/run.py \
            --output "$RUNNER_TEMP/thumbnail-playlist-neighbors" --pairs 6 "${mode[@]}"
      - name: Publish results and reproducibility receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'thumbnail-playlist-neighbors'
          for name in ['summary.json', 'manifest.json', 'tests.json', 'source-receipts.json',
                       'build-receipts.json', 'measurements.jsonl']:
              path = root / name
              if path.is_file():
                  print('THUMBNAIL_NEIGHBORS_FILE_BEGIN ' + name)
                  print(path.read_text())
                  print('THUMBNAIL_NEIGHBORS_FILE_END ' + name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-playlist-neighbors-portable
          path: |
            ${{ runner.temp }}/thumbnail-playlist-neighbors/*.json
            ${{ runner.temp }}/thumbnail-playlist-neighbors/*.jsonl
            ${{ runner.temp }}/thumbnail-playlist-neighbors/*.log
            ${{ runner.temp }}/thumbnail-playlist-neighbors/logs/
          retention-days: 14

