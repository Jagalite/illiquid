name: Playback model (Statelessness)

# Replaces the per-change qualification workflows whose harnesses compiled
# the retired IlliquidPlaybackCore (see
# Documentation/StatelessnessProduction/STATUS.md, PD16). Runs the production
# model, its session host, verification, and the player/native tests that
# exercise them, on the reviewed native SDK.
on:
  pull_request:
    paths:
      - 'Sources/IlliquidPlaybackModel/**'
      - 'Sources/IlliquidPlaybackStateSpace/**'
      - 'Sources/IlliquidPlayback/**'
      - 'Sources/IlliquidPlayer/**'
      - 'Sources/IlliquidNativePlayback/Production/**'
      - 'Sources/IlliquidNativePlayback/Runtime/**'
      - 'Tests/IlliquidPlaybackModelTests/**'
      - 'Tests/IlliquidPlaybackStateSpaceTests/**'
      - 'Tests/IlliquidPlayerTests/**'
      - 'Validation/IlliquidArchitectureCheck/**'
      - 'Scripts/run-playback-state-space.sh'
      - 'Scripts/test-renderer-recovery.sh'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/playback-model.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/IlliquidPlaybackModel/**'
      - 'Sources/IlliquidPlaybackStateSpace/**'
      - 'Package.resolved'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-model-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  model-and-integration:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the pinned native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Model, session host, verification, player and native lifetime tests
        run: |
          mkdir -p "$RUNNER_TEMP/playback-model"
          set -o pipefail
          swift test --force-resolved-versions --no-parallel \
            --filter 'IlliquidPlaybackModelTests|IlliquidPlaybackStateSpaceTests|RelativeSeekEffectLifetimeTests|PlaybackCoordinatorTests|RuntimeLeaseHistoryTests|RuntimeAuthorityFenceTests|NativeOperationWorkLifetimeTests' \
            2>&1 | tee "$RUNNER_TEMP/playback-model/tests.log"
      - name: Architecture check
        run: swift run --force-resolved-versions IlliquidArchitectureCheck 2>&1 | tee "$RUNNER_TEMP/playback-model/architecture.log"
      - name: Renderer recovery regressions without native SDKs
        run: bash Scripts/test-renderer-recovery.sh 2>&1 | tee "$RUNNER_TEMP/playback-model/renderer-recovery.log"
      - name: PR state-space profile on the production model
        run: |
          ILLIQUID_STATE_SPACE_ARTIFACT_ROOT="$RUNNER_TEMP/playback-model/state-space" \
            ./Scripts/run-playback-state-space.sh 2>&1 \
            | grep -v state-space-progress | tee "$RUNNER_TEMP/playback-model/state-space.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-model
          path: ${{ runner.temp }}/playback-model/
          retention-days: 14
