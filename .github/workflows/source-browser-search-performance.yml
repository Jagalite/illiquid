name: Source browser search performance

on:
  push:
    branches:
      - perf/source-search-indices-20261028
  pull_request:
    paths:
      - Sources/IlliquidApp/UI/SourceBrowserFilter.swift
      - Sources/IlliquidApp/UI/SourceTreeProjectionInput.swift
      - Sources/IlliquidApp/UI/SourcesSidebar.swift
      - Tests/IlliquidAppTests/SourceBrowserSearchTests.swift
      - Scripts/test-source-browser-search.py
      - Benchmarks/SourceBrowserSearch/Harness.swift
      - Benchmarks/SourceBrowserSearch/run.py
      - .github/workflows/source-browser-search-performance.yml
  workflow_dispatch:

env:
  SOURCE_SEARCH_BASELINE: ea2ff568237e2667f7b1aeee67b11a44ebe95b72

permissions:
  contents: read

concurrency:
  group: source-browser-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record Linux host
        run: |
          mkdir -p "$RUNNER_TEMP/source-search"
          uname -a > "$RUNNER_TEMP/source-search/host.txt"
          lscpu >> "$RUNNER_TEMP/source-search/host.txt"
          swift --version >> "$RUNNER_TEMP/source-search/host.txt"
          python3 --version >> "$RUNNER_TEMP/source-search/host.txt"
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion" >> "$RUNNER_TEMP/source-search/host.txt"
      - name: Verify baseline and candidate behavior in debug and release
        run: |
          for configuration in debug release; do
            python3 Scripts/test-source-browser-search.py \
              --configuration "$configuration" --baseline-ref "$SOURCE_SEARCH_BASELINE" \
              --output "$RUNNER_TEMP/source-search/baseline-$configuration"
            python3 Scripts/test-source-browser-search.py \
              --configuration "$configuration" \
              --output "$RUNNER_TEMP/source-search/candidate-$configuration"
          done
      - name: Measure complete search and cached projection workloads
        run: |
          search_cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 Benchmarks/SourceBrowserSearch/run.py \
            --baseline-ref "$SOURCE_SEARCH_BASELINE" \
            --pairs 6 --target-ms 120 --cpu "$search_cpu" \
            --output "$RUNNER_TEMP/source-search/timing"
      - name: Measure allocation requests separately from timing
        run: |
          search_cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python3 Benchmarks/SourceBrowserSearch/run.py \
            --baseline-ref "$SOURCE_SEARCH_BASELINE" \
            --allocations --pairs 2 --cpu "$search_cpu" \
            --output "$RUNNER_TEMP/source-search/allocations"
      - name: Report reproducible component evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "source-search"
          files = [root / "host.txt"]
          for variant in ("baseline", "candidate"):
              for configuration in ("debug", "release"):
                  files.append(root / f"{variant}-{configuration}" / "receipt.json")
          for cohort in ("timing", "allocations"):
              for name in ("environment.json", "baseline-build.json", "candidate-build.json",
                           "measurements.jsonl", "summary.json", "completion.json"):
                  files.append(root / cohort / name)
          for path in files:
              if path.is_file():
                  relative = path.relative_to(root)
                  print(f"SOURCE_SEARCH_EVIDENCE_BEGIN {relative}", flush=True)
                  print(path.read_text(), end="", flush=True)
                  print(f"SOURCE_SEARCH_EVIDENCE_END {relative}", flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-browser-search-linux
          path: |
            ${{ runner.temp }}/source-search/
            !${{ runner.temp }}/source-search/**/.build/**
            !${{ runner.temp }}/source-search/**/cache/**
            !${{ runner.temp }}/source-search/**/module-cache/**
          retention-days: 14

  native-component:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record native host
        run: |
          mkdir -p "$RUNNER_TEMP/source-search"
          sw_vers > "$RUNNER_TEMP/source-search/host.txt"
          uname -a >> "$RUNNER_TEMP/source-search/host.txt"
          sysctl -n machdep.cpu.brand_string >> "$RUNNER_TEMP/source-search/host.txt"
          swift --version >> "$RUNNER_TEMP/source-search/host.txt"
      - name: Verify baseline and candidate behavior in debug and release
        run: |
          for configuration in debug release; do
            python3 Scripts/test-source-browser-search.py \
              --configuration "$configuration" --baseline-ref "$SOURCE_SEARCH_BASELINE" \
              --output "$RUNNER_TEMP/source-search/baseline-$configuration"
            python3 Scripts/test-source-browser-search.py \
              --configuration "$configuration" \
              --output "$RUNNER_TEMP/source-search/candidate-$configuration"
          done
      - name: Measure complete search and cached projection workloads
        run: |
          python3 Benchmarks/SourceBrowserSearch/run.py \
            --baseline-ref "$SOURCE_SEARCH_BASELINE" \
            --pairs 6 --target-ms 120 \
            --output "$RUNNER_TEMP/source-search/timing"
      - name: Report reproducible component evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "source-search"
          files = [root / "host.txt"]
          for variant in ("baseline", "candidate"):
              for configuration in ("debug", "release"):
                  files.append(root / f"{variant}-{configuration}" / "receipt.json")
          for cohort in ("timing", "allocations"):
              for name in ("environment.json", "baseline-build.json", "candidate-build.json",
                           "measurements.jsonl", "summary.json", "completion.json"):
                  files.append(root / cohort / name)
          for path in files:
              if path.is_file():
                  relative = path.relative_to(root)
                  print(f"SOURCE_SEARCH_EVIDENCE_BEGIN {relative}", flush=True)
                  print(path.read_text(), end="", flush=True)
                  print(f"SOURCE_SEARCH_EVIDENCE_END {relative}", flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-browser-search-macos
          path: |
            ${{ runner.temp }}/source-search/
            !${{ runner.temp }}/source-search/**/.build/**
            !${{ runner.temp }}/source-search/**/cache/**
            !${{ runner.temp }}/source-search/**/module-cache/**
          retention-days: 14
