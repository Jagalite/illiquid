name: Checkpoint identities portable

on:
  push:
    branches: ['perf/checkpoint-identities-*']
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidPlayer/Player/PlaybackController.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidCoreTests/NaturalFilenameOrderingTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Benchmarks/CheckpointIdentities/Harness.swift'
      - 'Benchmarks/CheckpointIdentities/run.py'
      - '.github/workflows/checkpoint-identities-portable.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidPlayer/Player/PlaybackController.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidCoreTests/NaturalFilenameOrderingTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Benchmarks/CheckpointIdentities/Harness.swift'
      - 'Benchmarks/CheckpointIdentities/run.py'
      - '.github/workflows/checkpoint-identities-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-identities-portable-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test and measure the exact Foundation component
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this isolated Ubuntu runner; compiling packages serially.'
          git diff --check ea2ff568237e2667f7b1aeee67b11a44ebe95b72 HEAD
          python3 Benchmarks/CheckpointIdentities/run.py \
            --pairs 12 --target-ms 150 \
            --output "$RUNNER_TEMP/checkpoint-identities-portable"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-identities-portable
          path: |
            ${{ runner.temp }}/checkpoint-identities-portable/
            !${{ runner.temp }}/checkpoint-identities-portable/build/**
            !${{ runner.temp }}/checkpoint-identities-portable/module-cache/**
            !${{ runner.temp }}/checkpoint-identities-portable/swiftpm-cache/**
          retention-days: 30
