name: NFO text limit performance

on:
  push:
    branches:
      - codex/perf-nfo-text-limits-20261017
  pull_request:
    paths:
      - Sources/IlliquidCore/MediaLibrary/**
      - Tests/IlliquidCoreTests/*NFO*Tests.swift
      - Tests/IlliquidCoreTests/MediaSidecarTests.swift
      - Tests/IlliquidCoreTests/MediaNameRecognitionTests.swift
      - Benchmarks/NFOTextLimits/**
      - .github/workflows/nfo-text-limits.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfo-text-limits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions-and-benchmarks:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Sources/IlliquidCore
            Tests/IlliquidCoreTests
            Benchmarks/NFOTextLimits
      - name: Fetch pinned baseline
        run: git fetch --no-tags --depth=1 origin 68274d1b09dcc866296321a5a8858efc297c4f19
      - name: Test debug and release and compare matched release workloads
        run: python3 Benchmarks/NFOTextLimits/run.py --output "$RUNNER_TEMP/nfo-text-limits" --rounds 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nfo-text-limits
          path: ${{ runner.temp }}/nfo-text-limits/
          retention-days: 14
