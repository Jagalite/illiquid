name: Saved track matching performance

on:
  push:
    branches: ['codex/perf-saved-track-match-20261028']
    paths:
      - 'Sources/IlliquidCore/Persistence/MediaPlaybackSettings.swift'
      - 'Sources/IlliquidCore/Player/MediaTrack.swift'
      - 'Tests/IlliquidCoreTests/TrackRestorationRegressionTests.swift'
      - 'Tests/IlliquidCoreTests/MediaTrackParserTests.swift'
      - 'Tests/IlliquidCoreTests/SavedTrackMatchingTests.swift'
      - 'Tests/IlliquidCoreTests/TestSupport/SavedTrackMatchCorpus.swift'
      - 'Benchmarks/SavedTrackMatching/**'
      - '.github/workflows/saved-track-matching-performance.yml'
      - '!Benchmarks/SavedTrackMatching/README.md'
      - '!Benchmarks/SavedTrackMatching/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Persistence/MediaPlaybackSettings.swift'
      - 'Sources/IlliquidCore/Player/MediaTrack.swift'
      - 'Tests/IlliquidCoreTests/TrackRestorationRegressionTests.swift'
      - 'Tests/IlliquidCoreTests/MediaTrackParserTests.swift'
      - 'Tests/IlliquidCoreTests/SavedTrackMatchingTests.swift'
      - 'Tests/IlliquidCoreTests/TestSupport/SavedTrackMatchCorpus.swift'
      - 'Benchmarks/SavedTrackMatching/**'
      - '.github/workflows/saved-track-matching-performance.yml'
      - '!Benchmarks/SavedTrackMatching/README.md'
      - '!Benchmarks/SavedTrackMatching/evidence/**'

permissions:
  contents: read

concurrency:
  group: saved-track-matching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    name: component (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
    env:
      RESEARCH_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Select native component toolchain
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"

      - name: Check build coordination and record environment
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in this isolated checkout.'
          swiftc --version
          uname -m
          git rev-parse HEAD
          if test "$RUNNER_OS" = macOS; then
            sw_vers
            xcodebuild -version
          fi

      - name: Verify full results and measure paired performance
        run: >-
          python3 Benchmarks/SavedTrackMatching/run.py
          --output "$RUNNER_TEMP/saved-track-matching/timing"

      - name: Run baseline and candidate regressions in debug and release
        run: >-
          python3 Benchmarks/SavedTrackMatching/run.py --test
          --output "$RUNNER_TEMP/saved-track-matching/tests"

      - name: Emit results and exact evidence bundle
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "saved-track-matching"
          review = root / "review"
          review.mkdir(parents=True, exist_ok=True)
          ignored = {".build", "build", "cache", "config", "security", "module-cache", "sources"}
          files = {}
          for phase in ("timing", "tests"):
              for path in sorted((root / phase).rglob("*")):
                  relative = path.relative_to(root)
                  if (path.is_file() and not ignored.intersection(relative.parts)
                          and path.suffix in {".json", ".jsonl", ".log", ".txt"}):
                      files[str(relative)] = path.read_text()
          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "platform": os.environ["RESEARCH_PLATFORM"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          files["github-run.json"] = json.dumps(metadata, indent=2) + "\n"
          for name, value in files.items():
              if Path(name).name in {"summary.json", "tests.json", "verification.json", "failure.json", "manifest.json"}:
                  print("SAVED_TRACK_REVIEW " + json.dumps({"path": name, "data": json.loads(value)}, sort_keys=True))
          serialized = json.dumps(files, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          packed = gzip.compress(serialized, compresslevel=9, mtime=0)
          digest = hashlib.sha256(packed).hexdigest()
          (review / "evidence.json.gz").write_bytes(packed)
          (review / "evidence.sha256").write_text(digest + "  evidence.json.gz\n")
          print("SAVED_TRACK_BUNDLE_SHA256 " + digest)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit("Evidence exceeds the log bundle limit; use the artifact.")
          encoded = base64.b64encode(packed).decode()
          chunks = [encoded[start:start + 12000] for start in range(0, len(encoded), 12000)]
          for index, chunk in enumerate(chunks):
              print("SAVED_TRACK_BUNDLE_PART " + json.dumps({
                  "index": index, "parts": len(chunks), "data": chunk,
              }, separators=(",", ":")))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: saved-track-matching-${{ matrix.platform }}
          path: ${{ runner.temp }}/saved-track-matching/review/
          if-no-files-found: warn
          retention-days: 14
