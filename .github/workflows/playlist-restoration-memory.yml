name: Playlist restoration map memory
on:
  push:
    branches: ['perf/playlist-restoration-index-map-20261028']
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Tests/IlliquidCoreTests/NaturalFilenameOrderingTests.swift'
      - 'Scripts/test-playlist-restoration.sh'
      - 'Benchmarks/PlaylistRestorationMemory/Harness.swift'
      - 'Benchmarks/PlaylistRestorationMemory/MemoryProbe.*'
      - 'Benchmarks/PlaylistRestorationMemory/run.py'
      - '.github/workflows/playlist-restoration-memory.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Tests/IlliquidCoreTests/NaturalFilenameOrderingTests.swift'
      - 'Scripts/test-playlist-restoration.sh'
      - 'Benchmarks/PlaylistRestorationMemory/**'
      - '.github/workflows/playlist-restoration-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playlist-restoration-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build coordination and environment
        shell: bash
        run: |
          set -euo pipefail
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; builds run serially in isolated packages.'
          mkdir -p "$RUNNER_TEMP/playlist-restoration-memory"
          swift --version
          sw_vers
          uname -m
          git rev-parse HEAD
      - name: Candidate debug regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/test-playlist-restoration.sh 2>&1 |
            tee "$RUNNER_TEMP/playlist-restoration-memory/candidate-debug.log"
      - name: Candidate release regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/test-playlist-restoration.sh -c release 2>&1 |
            tee "$RUNNER_TEMP/playlist-restoration-memory/candidate-release.log"
      - name: Pinned baseline release regression tests
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/playlist-restoration-baseline" \
            ea2ff568237e2667f7b1aeee67b11a44ebe95b72
          bash "$RUNNER_TEMP/playlist-restoration-baseline/Scripts/test-playlist-restoration.sh" \
            -c release 2>&1 |
            tee "$RUNNER_TEMP/playlist-restoration-memory/baseline-release.log"
      - name: Paired native memory and timing experiment
        run: >-
          python3 Benchmarks/PlaylistRestorationMemory/run.py
          --output "$RUNNER_TEMP/playlist-restoration-memory/research"
          --pairs 8 --rounds 3 --sizes 100 10000 100000
      - name: Print portable evidence and diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "playlist-restoration-memory" / "research"
          for name in ("summary.json", "receipts.json", "samples.jsonl"):
              path = root / name
              if path.exists():
                  print(f"::group::{name}")
                  print(path.read_text())
                  print("::endgroup::")
          for path in sorted(root.glob("*.log")):
              if path.stat().st_size:
                  print(f"::group::{path.name}")
                  print(path.read_text())
                  print("::endgroup::")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playlist-restoration-memory-macos
          path: ${{ runner.temp }}/playlist-restoration-memory/
          retention-days: 14
