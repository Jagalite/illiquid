name: PR3 integration qualification
on:
  push:
    branches: [work/pr3-integration-qualification]
permissions:
  contents: read
concurrency:
  group: pr3-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 30
    # Needed only to store verified immutable source blobs after tests succeed.
    # No commit, ref, main branch, release, or installed-user-state writes.
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Materialize and verify reviewed source edits
        run: |
          python3 Validation/IntegrationCandidate/apply.py
          git diff --check
          git rev-parse HEAD > evidence/qualification-revision.txt
          git diff > evidence/materialized-source.diff
          tar -cf evidence/source.tar Sources Tests Scripts Package.swift Package.resolved
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate product fixtures
        run: |
          bash Scripts/generate-product-fixtures.sh "$RUNNER_TEMP/illiquid-product-fixtures"
          echo "ILLIQUID_PRODUCT_FIXTURES=$RUNNER_TEMP/illiquid-product-fixtures" >> "$GITHUB_ENV"
          echo "ILLIQUID_NATIVE_FIXTURE_DIR=$RUNNER_TEMP/illiquid-product-fixtures" >> "$GITHUB_ENV"
      - name: Build and test integrated application graph
        run: |
          set -o pipefail
          swift --version > evidence/toolchain.txt
          swift test --force-resolved-versions --no-parallel --filter \
            'PlaybackProduct|PlaybackCoordinatorTests|CaptionNavigation|PlaybackAutomation|TrackRestorationRegressionTests|ThumbnailLifecycleRegressionTests|RuntimeAuthorityFenceTests|NativePictureInPictureTransitionTests|RendererObservationBoundsTests|AudioDelayTests' \
            2>&1 | tee evidence/swift-test.log
      - name: Test standalone restoration harness
        run: |
          set -o pipefail
          bash Scripts/test-restoration-regressions.sh 2>&1 | tee evidence/restoration-test.log
      - name: Publish verified immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Validation/IntegrationCandidate/publish_objects.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-qualification
          path: evidence/
          retention-days: 7
