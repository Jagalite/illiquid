name: Video ratio parser portable performance

on:
  push:
    branches: ['perf/video-ratio-parsing-*']
    paths:
      - 'Sources/IlliquidCore/Player/VideoPresentationGeometry.swift'
      - 'Benchmarks/VideoRatioParsing/Driver.swift'
      - 'Benchmarks/VideoRatioParsing/baseline.json'
      - 'Benchmarks/VideoRatioParsingPortable/**'
      - '.github/workflows/video-ratio-parsing-portable.yml'
      - '!Benchmarks/VideoRatioParsingPortable/README.md'
      - '!Benchmarks/VideoRatioParsingPortable/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Player/VideoPresentationGeometry.swift'
      - 'Benchmarks/VideoRatioParsing/Driver.swift'
      - 'Benchmarks/VideoRatioParsing/baseline.json'
      - 'Benchmarks/VideoRatioParsingPortable/**'
      - '.github/workflows/video-ratio-parsing-portable.yml'
      - '!Benchmarks/VideoRatioParsingPortable/README.md'
      - '!Benchmarks/VideoRatioParsingPortable/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-ratio-parsing-portable-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  parser-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: swift:6.2.4-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    steps:
      - name: Install Python runner dependency
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            Sources/IlliquidCore
            Benchmarks/VideoRatioParsing
            Benchmarks/VideoRatioParsingPortable
      - name: Compare exact parser outputs and paired release timings
        run: |
          python3 Benchmarks/VideoRatioParsingPortable/run.py \
            --pairs 6 --target-ms 150 --minimum-ms 60 \
            --output "$RUNNER_TEMP/video-ratio-parser-portable"
      - name: Emit reviewable evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'video-ratio-parser-portable'
          files = {}
          for path in sorted(root.rglob('*')):
              if (path.is_file() and path.suffix in {'.json', '.jsonl', '.log', '.txt', '.stdout', '.stderr'}
                      and not any(part in {'module-cache', '.build'} for part in path.relative_to(root).parts)):
                  files[str(path.relative_to(root))] = path.read_text()
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds log bundle limit; use uploaded artifact')
          print('VIDEO_RATIO_PORTABLE_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('VIDEO_RATIO_PORTABLE_BASE64 ' + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-ratio-parser-portable
          path: |
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.json
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.jsonl
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.log
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.txt
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.stdout
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.stderr
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.swift
            ${{ runner.temp }}/video-ratio-parser-portable/**/*.py
            !${{ runner.temp }}/video-ratio-parser-portable/**/module-cache/**
          retention-days: 14
