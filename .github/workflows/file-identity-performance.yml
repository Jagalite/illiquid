name: File identity key performance

on:
  push:
    branches: ['perf/file-identity-keys']
    paths:
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Tests/IlliquidCoreTests/NormalizedFileURLPersistenceKeyTests.swift'
      - 'Tests/IlliquidCoreTests/LocalMediaSourceValidationTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylist*Tests.swift'
      - 'Benchmarks/FileIdentityKeys/**'
      - '.github/workflows/file-identity-performance.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Tests/IlliquidCoreTests/NormalizedFileURLPersistenceKeyTests.swift'
      - 'Tests/IlliquidCoreTests/LocalMediaSourceValidationTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylist*Tests.swift'
      - 'Benchmarks/FileIdentityKeys/**'
      - '.github/workflows/file-identity-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact key bytes and measure production lookups
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto unavailable on this ephemeral runner; compiling serially in an isolated checkout.'
          python3 Benchmarks/FileIdentityKeys/run.py --mode all --pairs 10 \
            --output "$RUNNER_TEMP/file-identity"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: file-identity-native
          path: |
            ${{ runner.temp }}/file-identity/*.json
            ${{ runner.temp }}/file-identity/*.jsonl
            ${{ runner.temp }}/file-identity/logs/*.log
            ${{ runner.temp }}/file-identity/sources/**
          retention-days: 14
