name: Checkpoint identity performance

on:
  push:
    branches: ['perf/checkpoint-identity-*']
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Sources/IlliquidCore/**'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointWriterTests.swift'
      - 'Tests/IlliquidCoreTests/**'
      - 'Benchmarks/CheckpointIdentity/**'
      - '.github/workflows/checkpoint-identity-performance.yml'
      - '!Benchmarks/CheckpointIdentity/*.md'
      - '!Benchmarks/CheckpointIdentity/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointWriterTests.swift'
      - 'Benchmarks/CheckpointIdentity/**'
      - '.github/workflows/checkpoint-identity-performance.yml'
      - '!Benchmarks/CheckpointIdentity/*.md'
      - '!Benchmarks/CheckpointIdentity/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-identity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-checkpoint:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test and benchmark complete checkpoint records
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          command = [sys.executable, 'Benchmarks/CheckpointIdentity/run.py',
                     '--output', str(Path(os.environ['RUNNER_TEMP']) / 'checkpoint-identity'),
                     '--run-tests', '--enforce-performance']
          queue = Path('/Volumes/seed1/Projects/kyoto/kyoto.py')
          if queue.is_file():
              cli = [sys.executable, str(queue)]
              submitted = subprocess.check_output([*cli, 'submit', '--', *command], text=True)
              print(submitted, flush=True)
              job_id = json.loads(submitted)['id']
              subprocess.run([*cli, 'show', job_id], check=True)
              result = subprocess.run([*cli, 'wait', job_id])
              subprocess.run([*cli, 'logs', job_id], check=True)
              sys.exit(result.returncode)
          print('The shared Kyoto queue is unavailable on this hosted runner; '
                'using isolated, serial component builds and benchmarks.', flush=True)
          subprocess.run(command, check=True)
          PY
      - name: Emit reviewable measurement evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'checkpoint-identity'
          text_files, semantics = {}, {}
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if any(part in {'build', 'module-cache'} for part in relative.parts):
                  continue
              if path.is_file() and path.suffix in {'.json', '.jsonl', '.log'}:
                  text_files[str(relative)] = path.read_text()
              elif path.is_file() and path.name.endswith('.json.gz'):
                  semantics[str(relative)] = base64.b64encode(path.read_bytes()).decode()
          for name in ['acceptance.json', 'tests.json', 'summary.json']:
              if name in text_files:
                  print(name + '\n' + text_files[name])
          packed = gzip.compress(json.dumps({'text_files': text_files,
              'semantics_base64': semantics}, sort_keys=True).encode(), mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds log limit; use the uploaded artifact')
          print('CHECKPOINT_EVIDENCE_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('CHECKPOINT_EVIDENCE_BASE64 ' + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-identity-native
          path: |
            ${{ runner.temp }}/checkpoint-identity/*.json
            ${{ runner.temp }}/checkpoint-identity/*.jsonl
            ${{ runner.temp }}/checkpoint-identity/logs/*.log
            ${{ runner.temp }}/checkpoint-identity/semantics/*.json.gz
          retention-days: 14
