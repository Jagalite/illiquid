name: Non-decoding performance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: non-decoding-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive the exact tested sources
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git archive --format=tar HEAD Sources Tests Scripts Documentation Validation Package.swift Package.resolved .github > evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: non-decoding-performance-source
          path: evidence/
          retention-days: 7
