name: Empty subtitle association performance

on:
  push:
    branches: [perf/skip-empty-subtitle-association]
    paths:
      - Sources/IlliquidCore/Playlist/**
      - Sources/IlliquidCore/Utilities/**
      - Tests/IlliquidCoreTests/**
      - Benchmarks/EmptySubtitleAssociation/**
      - .github/workflows/empty-subtitle-association-performance.yml
  pull_request:
    paths:
      - Sources/IlliquidCore/Playlist/**
      - Sources/IlliquidCore/Utilities/**
      - Tests/IlliquidCoreTests/ExternalSubtitleMatcherTests.swift
      - Benchmarks/EmptySubtitleAssociation/**
      - .github/workflows/empty-subtitle-association-performance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empty-subtitle-association-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify baseline and candidate in debug and release
        run: |
          python3 Benchmarks/EmptySubtitleAssociation/run.py --tests-only \
            --output "$RUNNER_TEMP/empty-subtitle-association/tests"
      - name: Measure paired native components
        run: |
          python3 Benchmarks/EmptySubtitleAssociation/run.py \
            --pairs 8 --target-ms 80 --max-sample-ms 1500 \
            --output "$RUNNER_TEMP/empty-subtitle-association/timing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: empty-subtitle-association-macos
          path: ${{ runner.temp }}/empty-subtitle-association
          retention-days: 14
