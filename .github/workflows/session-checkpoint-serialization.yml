name: Session checkpoint serialization

on:
  push:
    branches: ['perf/session-checkpoint-serialization-d27e3']
    paths:
      - 'Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift'
      - 'Tests/IlliquidCoreTests/PlaybackSessionStoreTests.swift'
      - 'Benchmarks/SessionCheckpointSerialization/Harness.swift'
      - 'Benchmarks/SessionCheckpointSerialization/run.py'
      - '.github/workflows/session-checkpoint-serialization.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift'
      - 'Tests/IlliquidCoreTests/PlaybackSessionStoreTests.swift'
      - 'Benchmarks/SessionCheckpointSerialization/Harness.swift'
      - 'Benchmarks/SessionCheckpointSerialization/run.py'
      - '.github/workflows/session-checkpoint-serialization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-checkpoint-serialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test compatibility and measure atomic saves on macOS
        run: >-
          python3 Benchmarks/SessionCheckpointSerialization/run.py
          --pairs 8 --target-ms 80 --output "$RUNNER_TEMP/session-checkpoint"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: session-checkpoint-serialization-macos
          path: ${{ runner.temp }}/session-checkpoint/evidence/
          retention-days: 14
