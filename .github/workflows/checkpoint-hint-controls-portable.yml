name: Checkpoint zero-hint portable performance

on:
  push:
    branches: ['codex/perf-checkpoint-zero-hint-fdd5ab']
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointIndexHintTests.swift'
      - 'Benchmarks/CheckpointHintControls/Driver.swift'
      - 'Benchmarks/CheckpointHintControls/run.py'
      - '.github/workflows/checkpoint-hint-controls-portable.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Sources/IlliquidCore/Playlist/PlaylistMutation.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidCore/Utilities/MediaFileSupport.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointIndexHintTests.swift'
      - 'Tests/IlliquidCoreTests/PlaylistMutationTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Tests/IlliquidCoreTests/UtilitiesTests.swift'
      - 'Benchmarks/CheckpointHintControls/Driver.swift'
      - 'Benchmarks/CheckpointHintControls/run.py'
      - '.github/workflows/checkpoint-hint-controls-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-hint-controls-portable-${{ github.ref }}
  cancel-in-progress: true

# Supplemental component evidence; the macOS workflow qualifies the app platform.
jobs:
  checkpoint-construction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    env:
      CHECKPOINT_SWIFT_IMAGE: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Python and fetch the pinned baseline
        shell: bash
        run: |
          if ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y python3
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin 2620d561d11c9a7d9396d3b455424a10a6dddcd7
      - name: Verify portable checkpoint semantics and measure paired runs
        id: qualification
        shell: bash
        run: |
          echo "output=$RUNNER_TEMP/checkpoint-hint-controls-portable" >> "$GITHUB_OUTPUT"
          echo 'Kyoto is unavailable on this ephemeral Linux runner; building serially in isolated packages.'
          mode=()
          if test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            mode+=(--tests-only)
          fi
          python3 Benchmarks/CheckpointHintControls/run.py \
            --portable --pairs 8 --target-ms 250 \
            --output "$RUNNER_TEMP/checkpoint-hint-controls-portable" "${mode[@]}"
      - name: Publish reproducibility receipts in the job log
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'checkpoint-hint-controls-portable'
          for name in ['summary.json', 'manifest.json', 'calibration.json',
                       'observations.jsonl', 'commands.jsonl']:
              path = root / name
              if path.is_file():
                  print('CHECKPOINT_FILE_BEGIN ' + name)
                  print(path.read_text())
                  print('CHECKPOINT_FILE_END ' + name)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.qualification.outputs.output != ''
        with:
          name: checkpoint-hint-controls-portable
          path: |
            ${{ steps.qualification.outputs.output }}/*.json
            ${{ steps.qualification.outputs.output }}/*.jsonl
            ${{ steps.qualification.outputs.output }}/runner.snapshot.py
            ${{ steps.qualification.outputs.output }}/logs/
          retention-days: 14
