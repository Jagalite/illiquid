name: Track selection ranking performance
on:
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Player/TrackSelectionPreferences.swift'
      - 'Sources/IlliquidCore/Player/MediaTrack.swift'
      - 'Tests/IlliquidCoreTests/TrackSelection*Tests.swift'
      - 'Benchmarks/TrackSelectionRanking/**'
      - '.github/workflows/track-selection-ranking.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-selection-ranking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record native environment
        run: |
          mkdir -p "$RUNNER_TEMP/track-selection-ranking"
          if [[ ! -f /Volumes/seed1/Projects/kyoto/kyoto.py ]]; then
            echo "Kyoto unavailable on this hosted runner; using isolated serial component builds."
          fi
          sw_vers > "$RUNNER_TEMP/track-selection-ranking/system.txt"
          xcrun swiftc --version >> "$RUNNER_TEMP/track-selection-ranking/system.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/track-selection-ranking/revision.txt"
      - name: Check baseline and candidate in debug and release
        run: |
          python3 Benchmarks/TrackSelectionRanking/run.py test --baseline-dir Benchmarks/TrackSelectionRanking/baseline-compact-rank --configuration debug --output "$RUNNER_TEMP/track-selection-ranking/debug"
          python3 Benchmarks/TrackSelectionRanking/run.py test --baseline-dir Benchmarks/TrackSelectionRanking/baseline-compact-rank --configuration release --output "$RUNNER_TEMP/track-selection-ranking/release"
      - name: Compare complete selected-ID receipts and native paired timings
        run: |
          python3 Benchmarks/TrackSelectionRanking/run.py benchmark --baseline-dir Benchmarks/TrackSelectionRanking/baseline-compact-rank --rounds 20 --target-ms 250 --output "$RUNNER_TEMP/track-selection-ranking/benchmark"
          cat "$RUNNER_TEMP/track-selection-ranking/benchmark/summary.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: track-selection-ranking-native
          path: |
            ${{ runner.temp }}/track-selection-ranking/**/*.json
            ${{ runner.temp }}/track-selection-ranking/**/*.jsonl
            ${{ runner.temp }}/track-selection-ranking/**/*.log
            ${{ runner.temp }}/track-selection-ranking/**/*.txt
          retention-days: 14
