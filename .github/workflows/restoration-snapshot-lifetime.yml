name: Restoration snapshot lifetime
on:
  pull_request:
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackController.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCoordinatorTests.swift'
      - 'Benchmarks/RestoreSessionLifetime/**'
      - '.github/workflows/restoration-snapshot-lifetime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restoration-snapshot-lifetime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-retention:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Verify coordinator behavior and measure restoration ownership
        run: >-
          python3 Benchmarks/RestoreSessionLifetime/run.py
          --output "$RUNNER_TEMP/restoration-snapshot-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: restoration-snapshot-evidence
          path: ${{ runner.temp }}/restoration-snapshot-evidence/
          retention-days: 14
