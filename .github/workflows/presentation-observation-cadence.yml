name: Presentation observation cadence

on:
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Production/PresentationObservationCadence.swift'
      - 'Sources/IlliquidNativePlayback/Production/NativePlaybackRuntime.swift'
      - 'Sources/IlliquidNativePlayback/Presentation/NativePresentationCoordinator.swift'
      - 'Tests/IlliquidNativePlaybackTests/PresentationObservationCadenceTests.swift'
      - 'Benchmarks/PresentationObservationCadence/**'
      - '.github/workflows/presentation-observation-cadence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-observation-cadence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the production gate and compare native queue admission
        run: |
          python3 Benchmarks/PresentationObservationCadence/run.py \
            --pairs 7 --requests 100000 \
            --output "$RUNNER_TEMP/presentation-observation-cadence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: presentation-observation-cadence-native
          path: |
            ${{ runner.temp }}/presentation-observation-cadence/
            !${{ runner.temp }}/presentation-observation-cadence/module-cache/**
            !${{ runner.temp }}/presentation-observation-cadence/tests/.build/**
          retention-days: 14
