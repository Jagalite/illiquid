name: CI

# Standard checks for every pull request and for main: build, the full test
# suite, the architecture check, and the agent UI tool tests. The paired
# before/after harnesses in Benchmarks/ remain runnable by hand but are not
# part of CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the pinned native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build
        run: swift build --force-resolved-versions --build-tests
      # Serial: several tests wait on real timers and main-actor work, and
      # time out when the whole suite runs in parallel.
      - name: Test
        run: swift test --force-resolved-versions --skip-build --no-parallel
      - name: Architecture check
        run: swift run --force-resolved-versions IlliquidArchitectureCheck
      - name: Agent UI tool tests
        run: python3 -m unittest discover -s Tests/AgentUI -p 'test_*.py' -v
