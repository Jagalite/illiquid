name: Persistence key portable parity
on:
  push:
    branches: ['codex/perf-persistence-key-portable']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: persistence-key-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: swift:6.2.4-noble@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record the portable toolchain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/persistence-key-portable"
          swiftc --version | tee "$RUNNER_TEMP/persistence-key-portable/toolchain.txt"
          uname -a >> "$RUNNER_TEMP/persistence-key-portable/toolchain.txt"
      - name: Compare exact persistence-key bytes in debug and release
        shell: bash
        run: bash Benchmarks/PersistenceKey/check-parity.sh "$RUNNER_TEMP/persistence-key-portable"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: persistence-key-portable-swift-6.2.4
          path: ${{ runner.temp }}/persistence-key-portable/
          retention-days: 7
