name: Audio delay memory

on:
  push:
    branches: ['perf/audio-delay-pcm-sharing-*']
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/AudioDelayTimeline.swift'
      - 'Sources/IlliquidNativePlayback/Media/AudioDecoder.swift'
      - 'Tests/IlliquidNativePlaybackTests/AudioDelayTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/AudioDelayMemoryTests.swift'
      - 'Benchmarks/AudioDelayMemory/**'
      - '.github/workflows/audio-delay-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-delay-memory-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Qualify ownership and exact PCM timelines with native CoreMedia
        run: |
          python3 Benchmarks/AudioDelayMemory/run.py \
            --pairs 6 --target-ms 80 \
            --output "$RUNNER_TEMP/audio-delay-component"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-delay-component
          path: |
            ${{ runner.temp }}/audio-delay-component/
            !${{ runner.temp }}/audio-delay-component/build/**
          retention-days: 14

  native-audio:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate required audio-delay playback fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/audio-delay-native/fixtures"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=30' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 3 -shortest -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac \
            "$RUNNER_TEMP/audio-delay-native/fixtures/h264-aac.mp4"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'anullsrc=r=48000:cl=7.1' -t 2 -c:a flac \
            "$RUNNER_TEMP/audio-delay-native/fixtures/audio-7.1.flac"
          test -s "$RUNNER_TEMP/audio-delay-native/fixtures/h264-aac.mp4"
          test -s "$RUNNER_TEMP/audio-delay-native/fixtures/audio-7.1.flac"
      - name: Build the app graph and exercise delay, seek, stop, and draining
        run: |
          export ILLIQUID_NATIVE_FIXTURE_DIR="$RUNNER_TEMP/audio-delay-native/fixtures"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel --filter \
            'AudioDelayTests|AudioDelayMemoryTests|AudioResamplerDrainTests|MultichannelAudioTests' \
            2>&1 | tee "$RUNNER_TEMP/audio-delay-native/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audio-delay-native
          path: ${{ runner.temp }}/audio-delay-native/tests.log
          retention-days: 14
