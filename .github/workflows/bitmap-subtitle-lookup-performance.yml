name: Bitmap subtitle lookup performance

on:
  push:
    branches:
      - perf/bitmap-subtitle-lookup-20261028
    paths:
      - Sources/IlliquidNativePlayback/Subtitles/**
      - Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineOrderingTests.swift
      - Tests/IlliquidNativePlaybackTests/SubtitleMemoryBudgetAccountingTests.swift
      - Benchmarks/BitmapSubtitleLookup/**
      - .github/workflows/bitmap-subtitle-lookup-performance.yml
      - '!Benchmarks/BitmapSubtitleLookup/README.md'
      - '!Benchmarks/BitmapSubtitleLookup/evidence/**'
  pull_request:
    paths:
      - Sources/IlliquidNativePlayback/Subtitles/**
      - Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineOrderingTests.swift
      - Tests/IlliquidNativePlaybackTests/SubtitleMemoryBudgetAccountingTests.swift
      - Benchmarks/BitmapSubtitleLookup/**
      - .github/workflows/bitmap-subtitle-lookup-performance.yml
      - '!Benchmarks/BitmapSubtitleLookup/README.md'
      - '!Benchmarks/BitmapSubtitleLookup/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-subtitle-lookup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify baseline and candidate in debug and release
        run: |
          echo "Kyoto is unavailable on this isolated GitHub runner; building components directly."
          python3 Benchmarks/BitmapSubtitleLookup/run.py --tests-only \
            --output "$RUNNER_TEMP/bitmap-subtitle-lookup/tests"
      - name: Measure paired native components
        run: |
          python3 Benchmarks/BitmapSubtitleLookup/run.py \
            --pairs 8 --target-ms 80 --max-sample-ms 1500 \
            --output "$RUNNER_TEMP/bitmap-subtitle-lookup/timing"
      - name: Emit review evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "bitmap-subtitle-lookup"
          files = {str(p.relative_to(root)): p.read_text()
                   for p in sorted(root.rglob("*"))
                   if p.is_file() and "build" not in p.parts}
          # Keep source records accessible from logs for remote review.
          for name, content in files.items():
              if "/receipts/" not in name:
                  print("BITMAP_LOOKUP_FILE " + json.dumps({"path": name, "content": content},
                                                         sort_keys=True))
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(),
                                 compresslevel=9, mtime=0)
          print("BITMAP_LOOKUP_BUNDLE_SHA256 " + hashlib.sha256(packed).hexdigest())
          print("BITMAP_LOOKUP_BUNDLE_BASE64 " + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitmap-subtitle-lookup-macos
          path: ${{ runner.temp }}/bitmap-subtitle-lookup
          retention-days: 14
