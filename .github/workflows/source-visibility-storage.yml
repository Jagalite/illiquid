name: Source visibility storage memory

on:
  push:
    branches: ['perf/source-visibility-storage-20261023']
    paths:
      - 'Sources/IlliquidApp/UI/SourceBrowserFilter.swift'
      - 'Sources/IlliquidApp/UI/SourceTreeProjectionInput.swift'
      - 'Tests/IlliquidAppTests/SourceBrowserFilterTests.swift'
      - 'Tests/IlliquidAppTests/SourceTreeVisibilityCacheTests.swift'
      - 'Tests/IlliquidAppTests/SourceEmptyFolderVisibilityTests.swift'
      - 'Tests/IlliquidAppTests/SourceBrowserSearchTests.swift'
      - 'Tests/IlliquidAppTests/SourceMediaOrganizationTests.swift'
      - 'Tests/IlliquidAppTests/SourceVisibilityStorageTests.swift'
      - 'Benchmarks/SourceVisibilityStorage/**'
      - '.github/workflows/source-visibility-storage.yml'
      - '!Benchmarks/SourceVisibilityStorage/**/*.md'
      - '!Benchmarks/SourceVisibilityStorage/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidApp/UI/SourceBrowserFilter.swift'
      - 'Sources/IlliquidApp/UI/SourceTreeProjectionInput.swift'
      - 'Tests/IlliquidAppTests/SourceBrowserFilterTests.swift'
      - 'Tests/IlliquidAppTests/SourceTreeVisibilityCacheTests.swift'
      - 'Tests/IlliquidAppTests/SourceEmptyFolderVisibilityTests.swift'
      - 'Tests/IlliquidAppTests/SourceBrowserSearchTests.swift'
      - 'Tests/IlliquidAppTests/SourceMediaOrganizationTests.swift'
      - 'Tests/IlliquidAppTests/SourceVisibilityStorageTests.swift'
      - 'Benchmarks/SourceVisibilityStorage/**'
      - '.github/workflows/source-visibility-storage.yml'
      - '!Benchmarks/SourceVisibilityStorage/**/*.md'
      - '!Benchmarks/SourceVisibilityStorage/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-visibility-storage-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify visibility behavior and measure retained row storage
        run: |
          mode=()
          if test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            mode+=(--tests-only)
          fi
          python3 Benchmarks/SourceVisibilityStorage/run.py \
            --output "$RUNNER_TEMP/source-visibility-storage" \
            --pairs 6 --sizes 1000,10000,100000 "${mode[@]}"
      - name: Record native host and emit reproducibility evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/source-visibility-storage"
          sw_vers > "$RUNNER_TEMP/source-visibility-storage/host.txt"
          uname -a >> "$RUNNER_TEMP/source-visibility-storage/host.txt"
          sysctl -n machdep.cpu.brand_string >> "$RUNNER_TEMP/source-visibility-storage/host.txt"
          swift --version >> "$RUNNER_TEMP/source-visibility-storage/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/source-visibility-storage/host.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'source-visibility-storage'
          paths = {path for pattern in ('*.json', '*.jsonl', '*.log', '*.txt')
                   for path in root.glob(pattern) if path.is_file()}
          files = {path.name: path.read_text() for path in sorted(paths)}
          for path in sorted(root.glob('*.bin.gz')):
              files[path.name + '.base64'] = base64.b64encode(path.read_bytes()).decode()
          if 'summary.json' in files:
              print('::group::summary.json')
              print(files['summary.json'])
              print('::endgroup::')
          packed = gzip.compress(json.dumps(files, sort_keys=True, separators=(',', ':')).encode(),
                                 compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds the log bundle limit; use the uploaded artifact')
          print('SOURCE_VISIBILITY_STORAGE_BUNDLE_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('SOURCE_VISIBILITY_STORAGE_BUNDLE_BASE64 ' + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-visibility-storage-component
          path: |
            ${{ runner.temp }}/source-visibility-storage/*.json
            ${{ runner.temp }}/source-visibility-storage/*.jsonl
            ${{ runner.temp }}/source-visibility-storage/*.log
            ${{ runner.temp }}/source-visibility-storage/*.txt
            ${{ runner.temp }}/source-visibility-storage/*.bin.gz
            ${{ runner.temp }}/source-visibility-storage/**/*.swift
            ${{ runner.temp }}/source-visibility-storage/**/*.py
            ${{ runner.temp }}/source-visibility-storage/**/*.c
            ${{ runner.temp }}/source-visibility-storage/**/*.h
            ${{ runner.temp }}/source-visibility-storage/**/*.modulemap
            !${{ runner.temp }}/source-visibility-storage/**/.build/**
            !${{ runner.temp }}/source-visibility-storage/**/build/**
            !${{ runner.temp }}/source-visibility-storage/**/cache/**
            !${{ runner.temp }}/source-visibility-storage/**/module-cache/**
          retention-days: 14

  native-integration:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the pinned native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and qualify source visibility behavior
        run: |
          mkdir -p "$RUNNER_TEMP/source-visibility-storage-integration"
          sw_vers > "$RUNNER_TEMP/source-visibility-storage-integration/host.txt"
          uname -a >> "$RUNNER_TEMP/source-visibility-storage-integration/host.txt"
          swift --version >> "$RUNNER_TEMP/source-visibility-storage-integration/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/source-visibility-storage-integration/host.txt"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'SourceBrowserFilterTests|SourceTreeVisibilityCacheTests|SourceEmptyFolderVisibilityTests|SourceBrowserSearchTests|SourceMediaOrganizationTests|SourceVisibilityStorageTests' \
            2>&1 | tee "$RUNNER_TEMP/source-visibility-storage-integration/tests.log"
      - name: Emit native integration evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'source-visibility-storage-integration'
          paths = {path for pattern in ('*.json', '*.jsonl', '*.log', '*.txt')
                   for path in root.glob(pattern) if path.is_file()}
          files = {path.name: path.read_text() for path in sorted(paths)}
          packed = gzip.compress(json.dumps(files, sort_keys=True, separators=(',', ':')).encode(),
                                 compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds the log bundle limit; use the uploaded artifact')
          print('SOURCE_VISIBILITY_STORAGE_INTEGRATION_BUNDLE_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('SOURCE_VISIBILITY_STORAGE_INTEGRATION_BUNDLE_BASE64 ' + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-visibility-storage-integration
          path: ${{ runner.temp }}/source-visibility-storage-integration/
          retention-days: 14
