name: Source visibility root lookup

on:
  push:
    branches: ['perf/source-root-lookup-f307b7a']
    paths:
      - 'Sources/IlliquidApp/UI/SourcesSidebar.swift'
      - 'Tests/IlliquidAppTests/SourceVisibilityRootLookupTests.swift'
      - 'Benchmarks/SourceRootLookup/**'
      - '.github/workflows/source-root-lookup.yml'
      - '!Benchmarks/SourceRootLookup/**/*.md'
      - '!Benchmarks/SourceRootLookup/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidApp/UI/SourcesSidebar.swift'
      - 'Sources/IlliquidApp/UI/SourceTreeProjectionInput.swift'
      - 'Sources/IlliquidApp/UI/SourceBrowserFilter.swift'
      - 'Tests/IlliquidAppTests/SourceVisibilityRootLookupTests.swift'
      - 'Benchmarks/SourceRootLookup/**'
      - '.github/workflows/source-root-lookup.yml'
      - '!Benchmarks/SourceRootLookup/**/*.md'
      - '!Benchmarks/SourceRootLookup/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-root-lookup-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the native toolchain
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Verify root selection and measure paired workloads
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in isolated packages.'
          mode=()
          if test "$GITHUB_EVENT_NAME" = 'pull_request'; then
            mode+=(--tests-only)
          fi
          python3 Benchmarks/SourceRootLookup/run.py \
            --output "$RUNNER_TEMP/source-root-lookup" --pairs 6 "${mode[@]}"
      - name: Measure allocation requests separately from timing
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          python3 Benchmarks/SourceRootLookup/run.py \
            --output "$RUNNER_TEMP/source-root-allocations" \
            --mode benchmark --allocations --iterations 4 --pairs 6
      - name: Retain host and reproducibility evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/source-root-lookup"
          uname -a > "$RUNNER_TEMP/source-root-lookup/host.txt"
          swift --version >> "$RUNNER_TEMP/source-root-lookup/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/source-root-lookup/host.txt"
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for name in ['source-root-lookup', 'source-root-allocations']:
              root = Path(os.environ['RUNNER_TEMP']) / name
              if not root.exists():
                  continue
              evidence = root / 'evidence'
              evidence.mkdir(exist_ok=True)
              host = Path(os.environ['RUNNER_TEMP']) / 'source-root-lookup/host.txt'
              if host.exists():
                  shutil.copyfile(host, evidence / 'host.txt')
              for filename in ['tests.json', 'parity.json', 'summary.json']:
                  path = root / filename
                  if path.exists():
                      print('::group::' + name + '/' + filename)
                      print(path.read_text())
                      print('::endgroup::')
              print('Complete source snapshots, raw observations, and logs are retained in the artifact.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-root-lookup-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/source-root-lookup/evidence/
            ${{ runner.temp }}/source-root-allocations/evidence/
          retention-days: 14
