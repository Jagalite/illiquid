name: Bitmap subtitle acquisition borrowing

on:
  push:
    branches: ['perf/bitmap-subtitle-acquisition-borrow-20261028']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegDemuxer.swift'
      - 'Sources/IlliquidNativePlayback/Media/FFmpegPacket.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/BitmapSubtitleTimeline.swift'
      - 'Tests/IlliquidNativePlaybackTests/BitmapSubtitle*Tests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PGSSubtitle*Tests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PacketOwnershipTests.swift'
      - 'Scripts/generate-bitmap-subtitle-fixtures.py'
      - 'Benchmarks/BitmapSubtitleAcquisitionBorrow/**'
      - '.github/workflows/bitmap-subtitle-acquisition-borrow.yml'
      - '!Benchmarks/BitmapSubtitleAcquisitionBorrow/README.md'
      - '!Benchmarks/BitmapSubtitleAcquisitionBorrow/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegDemuxer.swift'
      - 'Sources/IlliquidNativePlayback/Media/FFmpegPacket.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/BitmapSubtitleTimeline.swift'
      - 'Tests/IlliquidNativePlaybackTests/BitmapSubtitle*Tests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PGSSubtitle*Tests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PacketOwnershipTests.swift'
      - 'Scripts/generate-bitmap-subtitle-fixtures.py'
      - 'Benchmarks/BitmapSubtitleAcquisitionBorrow/**'
      - '.github/workflows/bitmap-subtitle-acquisition-borrow.yml'
      - '!Benchmarks/BitmapSubtitleAcquisitionBorrow/README.md'
      - '!Benchmarks/BitmapSubtitleAcquisitionBorrow/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-subtitle-acquisition-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-bitmap-acquisition:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check build coordination before compiling
        run: |
          if [ -f /Volumes/seed1/Projects/kyoto/kyoto.py ]; then
            echo '::error::Kyoto is available; use its shared queue before running these builds.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this hosted runner. Component and app/test builds will run directly and sequentially.'
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Check acquisition parity and measure packet borrowing
        run: |
          python3 Benchmarks/BitmapSubtitleAcquisitionBorrow/run.py \
            --pairs 8 --target-ms 240 \
            --output "$RUNNER_TEMP/bitmap-subtitle-acquisition/benchmark"
      - name: Build the app graph and test bitmap subtitle reconstruction
        run: |
          fixture_dir="$RUNNER_TEMP/bitmap-subtitle-acquisition/fixtures"
          # The verified SDK includes ffmpeg but not ffprobe. PGS/DVD/DVB
          # container fixtures cover this change; VobSub pair tests are separate.
          python3 Scripts/generate-bitmap-subtitle-fixtures.py "$fixture_dir" --skip-vobsub
          for name in generated-pgs.mkv generated-dvd.mkv generated-dvb.mkv; do
            test -s "$fixture_dir/$name"
          done
          export ILLIQUID_BITMAP_FIXTURE_DIR="$fixture_dir"
          export ILLIQUID_PACKET_OWNERSHIP_FIXTURE="$fixture_dir/generated-pgs.mkv"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel --filter \
            'BitmapSubtitleAcquisitionBorrowTests|PGSSubtitlePacketBorrowTests|PGSSubtitleCropTests|BitmapSubtitleTests|PacketOwnershipTests' \
            2>&1 | tee "$RUNNER_TEMP/bitmap-subtitle-acquisition/native-tests.log"
      - name: Emit reviewable measurement receipts
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'bitmap-subtitle-acquisition'
          files = {}
          for path in sorted(root.rglob('*')):
              if (path.is_file() and path.suffix in {'.json', '.jsonl', '.log', '.txt'}
                      and not any(part in {'build', 'module-cache', 'cache', '.build'} for part in path.relative_to(root).parts)):
                  files[str(path.relative_to(root))] = path.read_text()
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          print('BITMAP_ACQUISITION_REVIEW_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('BITMAP_ACQUISITION_REVIEW_BASE64 ' + base64.b64encode(packed).decode())
          for name, value in files.items():
              if name.endswith(('summary.json', 'parity.json', 'completion.json')):
                  print(name + '\n' + value)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitmap-subtitle-acquisition-native
          path: |
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.json
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.jsonl
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.log
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.txt
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.swift
            ${{ runner.temp }}/bitmap-subtitle-acquisition/**/*.py
          retention-days: 14
