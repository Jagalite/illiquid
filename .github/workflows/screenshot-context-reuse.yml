name: Screenshot context reuse

on:
  push:
    branches: ['perf/screenshot-context-reuse-*']
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/NativeScreenshot.swift'
      - 'Tests/IlliquidNativePlaybackTests/ScreenshotContextReuseTests.swift'
      - 'Benchmarks/ScreenshotContextReuse/*.swift'
      - 'Benchmarks/ScreenshotContextReuse/*.py'
      - '.github/workflows/screenshot-context-reuse.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/NativeScreenshot.swift'
      - 'Sources/IlliquidCore/Player/VideoPresentationGeometry.swift'
      - 'Tests/IlliquidNativePlaybackTests/ScreenshotContextReuseTests.swift'
      - 'Benchmarks/ScreenshotContextReuse/**'
      - '.github/workflows/screenshot-context-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-context-reuse-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare decoded output and measure first and repeated captures
        run: |
          python3 Benchmarks/ScreenshotContextReuse/run.py \
            --pairs 6 --iterations 6 \
            --output "$RUNNER_TEMP/screenshot-context-reuse"
      - name: Print result receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'screenshot-context-reuse'
          for name in ['environment.json', 'verification.json', 'summary.json', 'completion.json']:
              path = root / name
              if path.is_file():
                  print(f'::group::{name}')
                  print(path.read_text())
                  print('::endgroup::')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screenshot-context-reuse-component
          path: |
            ${{ runner.temp }}/screenshot-context-reuse/
            !${{ runner.temp }}/screenshot-context-reuse/**/build/**
            !${{ runner.temp }}/screenshot-context-reuse/module-cache/**
          retention-days: 14

  native-app:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and verify screenshot behavior
        run: |
          mkdir -p "$RUNNER_TEMP/screenshot-context-reuse-app"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'ScreenshotContextReuseTests|screenshotIncludesSubtitleMaskAtTheExpectedPixels' \
            2>&1 | tee "$RUNNER_TEMP/screenshot-context-reuse-app/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: screenshot-context-reuse-app
          path: ${{ runner.temp }}/screenshot-context-reuse-app/
          retention-days: 14
