name: Deinterlacer EOF memory lifetime

on:
  push:
    branches: ['perf/deinterlacer-eof-memory-20261023']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/VideoDeinterlacer.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoDeinterlacerLifetimeTests.swift'
      - 'Benchmarks/DeinterlacerEOFMemory/**'
      - '.github/workflows/deinterlacer-eof-memory.yml'
      - '!Benchmarks/DeinterlacerEOFMemory/*.md'
      - '!Benchmarks/DeinterlacerEOFMemory/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/VideoDeinterlacer.swift'
      - 'Sources/IlliquidNativePlayback/Media/VideoDecoder.swift'
      - 'Sources/IlliquidNativePlayback/Media/FFmpegError.swift'
      - 'Sources/IlliquidNativePlayback/Media/MediaTime.swift'
      - 'Sources/CFFmpeg/**'
      - 'Tests/IlliquidNativePlaybackTests/VideoDeinterlacerTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/VideoDeinterlacerLifetimeTests.swift'
      - 'Benchmarks/DeinterlacerEOFMemory/**'
      - '.github/workflows/deinterlacer-eof-memory.yml'
      - '!Benchmarks/DeinterlacerEOFMemory/*.md'
      - '!Benchmarks/DeinterlacerEOFMemory/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deinterlacer-eof-memory-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-lifetime:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Compare output bytes and retained temporal allocations
        run: |
          python3 Benchmarks/DeinterlacerEOFMemory/run.py \
            --output "$RUNNER_TEMP/deinterlacer-eof/component" --pairs 4
      - name: Generate required interlaced playback fixtures
        run: |
          fixtures="$RUNNER_TEMP/deinterlacer-eof/fixtures"
          mkdir -p "$fixtures"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x180:rate=50" -t 2 \
            -vf "tinterlace=interleave_top,setfield=tff" -r 25 \
            -c:v mpeg2video -flags +ildct+ilme -top 1 -an "$fixtures/interlaced-tff.mpg"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x180:rate=50" -t 2 \
            -vf "tinterlace=interleave_bottom,setfield=bff" -r 25 \
            -c:v mpeg2video -flags +ildct+ilme -top 0 -an "$fixtures/interlaced-bff.mpg"
          for fixture in interlaced-tff.mpg interlaced-bff.mpg; do
            test -s "$fixtures/$fixture"
            ffmpeg -hide_banner -nostdin -v error -xerror -i "$fixtures/$fixture" -f null -
          done
      - name: Build the native application graph and test deinterlacing lifecycle
        env:
          ILLIQUID_NATIVE_FIXTURE_DIR: ${{ runner.temp }}/deinterlacer-eof/fixtures
        run: |
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'VideoDeinterlacerLifetimeTests|VideoDeinterlacerTests' \
            2>&1 | tee "$RUNNER_TEMP/deinterlacer-eof/native-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deinterlacer-eof-native-evidence
          path: |
            ${{ runner.temp }}/deinterlacer-eof/**/*.json
            ${{ runner.temp }}/deinterlacer-eof/**/*.jsonl
            ${{ runner.temp }}/deinterlacer-eof/**/*.log
            ${{ runner.temp }}/deinterlacer-eof/**/*.txt
            ${{ runner.temp }}/deinterlacer-eof/**/*.bin.gz
            !${{ runner.temp }}/deinterlacer-eof/**/.build/**
            !${{ runner.temp }}/deinterlacer-eof/**/module-cache/**
            !${{ runner.temp }}/deinterlacer-eof/**/tests/**/build-debug/**
            !${{ runner.temp }}/deinterlacer-eof/**/tests/**/build-release/**
            !${{ runner.temp }}/deinterlacer-eof/**/swiftpm-cache/**
          retention-days: 14
