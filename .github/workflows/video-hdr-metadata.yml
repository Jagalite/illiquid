name: Video HDR metadata performance

on:
  push:
    branches: ['perf/video-hdr-metadata-*']
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/VideoDecoder.swift'
      - 'Sources/CFFmpeg/**'
      - 'Tests/IlliquidNativePlaybackTests/VideoHDRMetadataTests.swift'
      - 'Benchmarks/VideoHDRMetadata/**'
      - '.github/workflows/video-hdr-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-hdr-metadata-refs/heads/${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-metadata:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Verify exact payloads and measure paired production code
        run: |
          mode=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mode+=(--current-source-regression --verify-only)
          fi
          python3 Benchmarks/VideoHDRMetadata/run.py \
            --pairs 20 --target-ms 300 \
            --output "$RUNNER_TEMP/video-hdr-metadata/component" "${mode[@]}"
      - name: Generate required native video fixtures
        if: github.event_name != 'push'
        run: |
          fixtures="$RUNNER_TEMP/video-hdr-metadata/fixtures"
          mkdir -p "$fixtures"
          hdr_master_display='G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,50)'
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=30' -t 3 \
            -vf 'format=yuv420p10le' -c:v libx265 -preset ultrafast \
            -x265-params "log-level=error:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:master-display=${hdr_master_display}:max-cll=1000,400" \
            -pix_fmt yuv420p10le -an "$fixtures/hdr10-pq-p010.mkv"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=30' -t 3 \
            -vf 'format=yuv420p10le' -c:v libx265 -preset ultrafast \
            -x265-params 'log-level=error:colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc' \
            -pix_fmt yuv420p10le -an "$fixtures/hlg-p010.mkv"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=640x360:rate=30' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 3 -shortest -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            -c:a aac "$fixtures/h264-aac.mp4"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=320x180:rate=24' -t 1 \
            -c:v libsvtav1 -preset 13 -pix_fmt yuv420p -an "$fixtures/av1-video-only.mkv"
          for file in hdr10-pq-p010.mkv hlg-p010.mkv h264-aac.mp4 av1-video-only.mkv; do
            test -s "$fixtures/$file"
          done
      - name: Build app graph and verify hardware and software decoder integration
        if: github.event_name != 'push'
        run: |
          export ILLIQUID_NATIVE_FIXTURE_DIR="$RUNNER_TEMP/video-hdr-metadata/fixtures"
          export ILLIQUID_NATIVE_REQUIRE_FIXTURES=1
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel --filter \
            'VideoHDRMetadataTests|preservesHDRColorMetadataAndP010|softwareHDRP010MatchesBGRAWithinMeasuredQuantization|av1NV12MatchesBGRABytesMetadataAndTiming' \
            2>&1 | tee "$RUNNER_TEMP/video-hdr-metadata/native-tests.log"
      - name: Print evidence receipts
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'video-hdr-metadata' / 'component'
          for name in ['build-receipt.json', 'parity.json', 'summary.json', 'completion.json']:
              path = root / name
              if path.exists():
                  print(f'::group::{name}')
                  data = json.loads(path.read_text())
                  if name == 'summary.json':
                      data = [{key: value for key, value in row.items() if key != 'paired_measurements'} for row in data]
                  print(json.dumps(data, indent=2, sort_keys=True))
                  print('::endgroup::')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: video-hdr-metadata-native
          path: |
            ${{ runner.temp }}/video-hdr-metadata/
            !${{ runner.temp }}/video-hdr-metadata/component/module-cache/**
            !${{ runner.temp }}/video-hdr-metadata/component/baseline/benchmark
            !${{ runner.temp }}/video-hdr-metadata/component/candidate/benchmark
          retention-days: 14
