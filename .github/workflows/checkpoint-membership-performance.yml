name: Checkpoint membership performance

on:
  push:
    branches: ['codex/checkpoint-membership-performance']
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Sources/IlliquidCore/Playlist/PlaylistMutation.swift'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidCore/Utilities/LifecyclePerformance.swift'
      - 'Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift'
      - 'Sources/IlliquidCore/Persistence/LegacyPreferencesMigration.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointTests.swift'
      - 'Tests/IlliquidCoreTests/PlaylistDeduplicationTests.swift'
      - 'Tests/IlliquidCoreTests/PlaylistSessionRecordTests.swift'
      - 'Tests/IlliquidCoreTests/PlaybackSessionStoreTests.swift'
      - 'Benchmarks/CheckpointMembership/**'
      - '.github/workflows/checkpoint-membership-performance.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidPlayer/Player/PlaybackCheckpointWriter.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Sources/IlliquidCore/Playlist/PlaylistMutation.swift'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidCore/Utilities/LifecyclePerformance.swift'
      - 'Sources/IlliquidCore/Persistence/PlaybackSessionStore.swift'
      - 'Sources/IlliquidCore/Persistence/LegacyPreferencesMigration.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCheckpointTests.swift'
      - 'Tests/IlliquidCoreTests/PlaylistDeduplicationTests.swift'
      - 'Tests/IlliquidCoreTests/PlaylistSessionRecordTests.swift'
      - 'Tests/IlliquidCoreTests/PlaybackSessionStoreTests.swift'
      - 'Benchmarks/CheckpointMembership/**'
      - '.github/workflows/checkpoint-membership-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-membership-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-foundation:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test checkpoint semantics and measure complete record construction
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in isolated packages.'
          python3 Benchmarks/CheckpointMembership/run.py \
            --pairs 6 --target-ms 50 \
            --output "$RUNNER_TEMP/checkpoint-membership"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-membership-macos
          path: |
            ${{ runner.temp }}/checkpoint-membership/*.json
            ${{ runner.temp }}/checkpoint-membership/*.jsonl
            ${{ runner.temp }}/checkpoint-membership/logs/
            ${{ runner.temp }}/checkpoint-membership/sources/
          retention-days: 14
