name: Standard completion contract memory

on:
  push:
    branches: ['perf/shared-one-shot-completion-contract']
    paths:
      - 'Sources/IlliquidPlaybackCore/**'
      - 'Tests/IlliquidPlaybackCoreTests/StandardCompletionContractTests.swift'
      - 'Benchmarks/StandardCompletionContract/**'
      - '.github/workflows/standard-completion-contract.yml'
      - '!Benchmarks/StandardCompletionContract/*.md'
      - '!Benchmarks/StandardCompletionContract/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-completion-contract-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Qualify existing benchmark source boundaries
        run: python3 Benchmarks/RuntimeLeaseHistory/test_source_boundaries.py
      - name: Test completion semantics and measure retained contract storage
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          command = [sys.executable, 'Benchmarks/StandardCompletionContract/run.py',
                     '--output', str(Path(os.environ['RUNNER_TEMP']) / 'standard-completion-contract'),
                     '--pairs', '4', '--counts', '1,128,4096', '--run-tests']
          queue = Path('/Volumes/seed1/Projects/kyoto/kyoto.py')
          if queue.is_file():
              cli = [sys.executable, str(queue)]
              submitted = subprocess.check_output([*cli, 'submit', '--', *command], text=True)
              print(submitted, flush=True)
              job_id = json.loads(submitted)['id']
              subprocess.run([*cli, 'show', job_id], check=True)
              result = subprocess.run([*cli, 'wait', job_id])
              subprocess.run([*cli, 'logs', job_id], check=True)
              sys.exit(result.returncode)
          print('The shared Kyoto queue is unavailable on this hosted runner; '
                'running isolated component builds directly.', flush=True)
          subprocess.run(command, check=True)
          PY
      - name: Emit reviewable native evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'standard-completion-contract'
          files = {}
          compressed_semantics = {}
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if (path.is_file() and path.suffix in {'.json', '.jsonl', '.log', '.txt'}
                      and not any(part in {'build', '.build', 'cache', 'module-cache'} for part in relative.parts)):
                  files[str(relative)] = path.read_text()
              elif path.is_file() and path.name.endswith('.json.gz') and relative.parts[0] == 'semantics':
                  compressed_semantics[str(relative)] = base64.b64encode(path.read_bytes()).decode()
          for name, content in files.items():
              if name.endswith(('summary.json', 'verification.json')):
                  print(name + '\n' + content)
          bundle = {'text_files': files, 'compressed_semantics_base64': compressed_semantics}
          packed = gzip.compress(json.dumps(bundle, sort_keys=True).encode(), compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds the log bundle limit; use the uploaded artifact')
          print('STANDARD_CONTRACT_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('STANDARD_CONTRACT_BASE64 ' + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standard-completion-contract-native
          path: |
            ${{ runner.temp }}/standard-completion-contract/*.json
            ${{ runner.temp }}/standard-completion-contract/*.jsonl
            ${{ runner.temp }}/standard-completion-contract/*.log
            ${{ runner.temp }}/standard-completion-contract/*.txt
            ${{ runner.temp }}/standard-completion-contract/semantics/*.json.gz
          retention-days: 14
