name: External subtitle conversion performance

on:
  pull_request:
    paths:
      - Sources/IlliquidNativePlayback/Subtitles/ExternalTextSubtitleConverter.swift
      - Tests/IlliquidNativePlaybackTests/ExternalTextSubtitleConverterTests.swift
      - Scripts/test-external-subtitle-regressions.sh
      - Benchmarks/ExternalSubtitleConversion/**
      - .github/workflows/external-subtitle-performance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-subtitle-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conversion:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the actual converter in debug and release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/external-subtitle-tests"
          bash Scripts/test-external-subtitle-regressions.sh --jobs 2 --no-parallel \
            -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/external-subtitle-tests/debug.log"
          bash Scripts/test-external-subtitle-regressions.sh --jobs 2 --no-parallel \
            -c release -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/external-subtitle-tests/release.log"
      - name: Compare complete conversions against the retained baseline
        run: |
          python3 Benchmarks/ExternalSubtitleConversion/run.py \
            --output "$RUNNER_TEMP/external-subtitle-benchmark" --samples 6
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-subtitle-conversion-evidence
          path: |
            ${{ runner.temp }}/external-subtitle-tests/
            ${{ runner.temp }}/external-subtitle-benchmark/
          retention-days: 14
