name: Playlist restoration qualification
on:
  push:
    branches:
      - 'perf/cache-natural-filename-keys'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidCoreTests/NaturalFilenameOrderingTests.swift'
      - 'Tests/IlliquidCoreTests/FolderPlaylistTests.swift'
      - 'Scripts/test-playlist-restoration.sh'
      - 'Benchmarks/PlaylistRestoration/**'
      - 'Benchmarks/NaturalFilenameOrdering/**'
      - '.github/workflows/playlist-restoration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playlist-restoration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-playlist:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Debug playlist tests
        run: bash Scripts/test-playlist-restoration.sh
      - name: Release playlist tests
        run: bash Scripts/test-playlist-restoration.sh -c release
      - name: Benchmark parity smoke (no performance threshold)
        run: >-
          python3 Benchmarks/PlaylistRestoration/run.py --sizes 100
          --repeats 1 --rounds 1 --output "$RUNNER_TEMP/playlist-restoration-smoke.json"
      - name: Measure natural filename ordering on macOS
        run: >-
          python3 Benchmarks/NaturalFilenameOrdering/run.py --samples 6
          --output "$RUNNER_TEMP/natural-filename-ordering"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: natural-filename-ordering-macos
          path: |
            ${{ runner.temp }}/natural-filename-ordering/*.json
            ${{ runner.temp }}/natural-filename-ordering/*.jsonl
            ${{ runner.temp }}/natural-filename-ordering/logs/
            ${{ runner.temp }}/natural-filename-ordering/sources/
            ${{ runner.temp }}/natural-filename-ordering/driver/
          retention-days: 14
