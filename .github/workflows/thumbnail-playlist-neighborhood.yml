name: Thumbnail playlist neighborhood performance

on:
  push:
    branches: ['perf/thumbnail-playlist-neighborhood-20261028']
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift'
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/Driver.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/run.py'
      - '.github/workflows/thumbnail-playlist-neighborhood.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift'
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/Driver.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/run.py'
      - '.github/workflows/thumbnail-playlist-neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnail-playlist-neighborhood-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test both implementations and measure paired native timings
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          command = [sys.executable, 'Benchmarks/ThumbnailPlaylistNeighborhood/run.py',
                     '--pairs', '8', '--output', os.environ['RUNNER_TEMP'] + '/thumbnail-neighborhood']
          queue = Path('/Volumes/seed1/Projects/kyoto/kyoto.py')
          if queue.is_file():
              cli = [sys.executable, str(queue)]
              submitted = subprocess.check_output([*cli, 'submit', '--', *command], text=True)
              print(submitted, flush=True)
              job_id = str(json.loads(submitted)['id'])
              subprocess.run([*cli, 'show', job_id], check=True)
              result = subprocess.run([*cli, 'wait', job_id])
              subprocess.run([*cli, 'logs', job_id], check=True)
              sys.exit(result.returncode)
          print('Shared Kyoto queue is unavailable on this hosted runner; '
                'compiling the isolated components directly and serially.', flush=True)
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-neighborhood-component
          path: |
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.json
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.jsonl
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.log
            ${{ runner.temp }}/thumbnail-neighborhood/packages/*/Package.swift
            ${{ runner.temp }}/thumbnail-neighborhood/packages/*/Sources/**/*.swift
            ${{ runner.temp }}/thumbnail-neighborhood/packages/*/Tests/**/*.swift
            !${{ runner.temp }}/thumbnail-neighborhood/**/.build/**
            !${{ runner.temp }}/thumbnail-neighborhood/**/module-cache/**
          retention-days: 14

  native-regressions:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Compile the app graph and run thumbnail scheduling regressions
        run: |
          mkdir -p "$RUNNER_TEMP/thumbnail-neighborhood-native"
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/thumbnail-neighborhood-native/tests.log"
          import json, subprocess, sys
          from pathlib import Path
          command = ['swift', 'test', '--force-resolved-versions', '--jobs', '2', '--no-parallel',
                     '--filter', 'ThumbnailPlaylistNeighborhoodTests|ThumbnailBackgroundSchedulerTests|'
                     'ThumbnailPolicyTests|ThumbnailSchedulingPolicyRegressionTests|ThumbnailLifecycleRegressionTests']
          queue = Path('/Volumes/seed1/Projects/kyoto/kyoto.py')
          if queue.is_file():
              cli = [sys.executable, str(queue)]
              submitted = subprocess.check_output([*cli, 'submit', '--', *command], text=True)
              print(submitted, flush=True)
              job_id = str(json.loads(submitted)['id'])
              subprocess.run([*cli, 'show', job_id], check=True)
              result = subprocess.run([*cli, 'wait', job_id])
              subprocess.run([*cli, 'logs', job_id], check=True)
              sys.exit(result.returncode)
          print('Shared Kyoto queue is unavailable on this hosted runner; '
                'compiling the app graph and running tests directly in this isolated checkout.', flush=True)
          subprocess.run(command, check=True)
          PY
          python3 - "$RUNNER_TEMP/thumbnail-neighborhood-native/tests.log" <<'PY'
          import re, sys
          from pathlib import Path
          counts = re.findall(r'Test run with (\d+) tests? .*passed', Path(sys.argv[1]).read_text())
          if not counts or int(counts[-1]) == 0:
              raise SystemExit('Missing positive native Swift Testing receipt')
          print('Native thumbnail regressions: ' + counts[-1] + ' tests passed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-neighborhood-native-regressions
          path: ${{ runner.temp }}/thumbnail-neighborhood-native/
          retention-days: 14
