name: Thumbnail playlist neighborhood

on:
  push:
    branches: ['perf/thumbnail-neighborhood-validation-25bf6887']
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift'
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/**'
      - '.github/workflows/thumbnail-playlist-neighborhood.yml'
      - '!Benchmarks/ThumbnailPlaylistNeighborhood/*.md'
      - '!Benchmarks/ThumbnailPlaylistNeighborhood/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift'
      - 'Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift'
      - 'Sources/IlliquidCore/Player/ThumbnailPolicy.swift'
      - 'Sources/IlliquidCore/Playlist/FolderPlaylist.swift'
      - 'Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift'
      - 'Tests/IlliquidAppTests/ThumbnailBackgroundSchedulerTests.swift'
      - 'Tests/IlliquidCoreTests/ThumbnailPolicyTests.swift'
      - 'Tests/IlliquidCoreTests/ThumbnailSchedulingPolicyRegressionTests.swift'
      - 'Benchmarks/ThumbnailPlaylistNeighborhood/**'
      - '.github/workflows/thumbnail-playlist-neighborhood.yml'
      - '!Benchmarks/ThumbnailPlaylistNeighborhood/*.md'
      - '!Benchmarks/ThumbnailPlaylistNeighborhood/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnail-playlist-neighborhood-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check build coordination
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in this isolated checkout.'
      - name: Verify neighborhood equivalence and measure preparation
        run: |
          python3 Benchmarks/ThumbnailPlaylistNeighborhood/run.py \
            --output "$RUNNER_TEMP/thumbnail-neighborhood"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-playlist-neighborhood-component
          path: |
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.json
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.jsonl
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.log
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.txt
            !${{ runner.temp }}/thumbnail-neighborhood/**/.build/**
            !${{ runner.temp }}/thumbnail-neighborhood/**/module-cache/**
          retention-days: 14

  portable-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check build coordination
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in this isolated checkout.'
      - name: Verify neighborhood equivalence and measure preparation
        run: |
          python3 Benchmarks/ThumbnailPlaylistNeighborhood/run.py \
            --output "$RUNNER_TEMP/thumbnail-neighborhood"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-playlist-neighborhood-portable
          path: |
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.json
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.jsonl
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.log
            ${{ runner.temp }}/thumbnail-neighborhood/**/*.txt
            !${{ runner.temp }}/thumbnail-neighborhood/**/.build/**
            !${{ runner.temp }}/thumbnail-neighborhood/**/module-cache/**
          retention-days: 14

  application:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the application graph and test thumbnail scheduling
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in this isolated checkout.'
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'ThumbnailPlaylistNeighborhoodTests|ThumbnailPolicyTests|ThumbnailSchedulingPolicyRegressionTests|ThumbnailBackgroundSchedulerTests/(currentVideoPreparationSharesIdleBudgetWithLibraryWork|navigationReplacesPendingWorkAndPlaybackCancelsAnActivePass|memoryPressureCancelsBackgroundWorkUntilNormalAndExclusionsPreventProbes|closedWindowRequiresOptInAndBudgetCancelsWork|removingVisibleRowsBeyondDiscoveryLimitCancelsTheirWork)' \
            2>&1 | tee "$RUNNER_TEMP/thumbnail-neighborhood-application.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-playlist-neighborhood-application
          path: ${{ runner.temp }}/thumbnail-neighborhood-application.log
          retention-days: 14
