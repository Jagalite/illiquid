name: Thumbnail playlist neighborhood

on:
  push:
    branches: [perf/thumbnail-neighborhood-bounded-ec593]
    paths:
      - Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift
      - Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift
      - Sources/IlliquidCore/Player/ThumbnailPolicy.swift
      - Tests/IlliquidAppTests/ThumbnailSingletonNeighborhoodTests.swift
      - Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift
      - Benchmarks/ThumbnailPlaylistNeighborhood/**
      - .github/workflows/thumbnail-playlist-neighborhood.yml
  pull_request:
    paths:
      - Sources/IlliquidApp/App/ThumbnailPlaylistNeighborhood.swift
      - Sources/IlliquidApp/App/ThumbnailBackgroundScheduler.swift
      - Sources/IlliquidCore/Playlist/FolderPlaylist.swift
      - Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift
      - Sources/IlliquidCore/Utilities/NormalizedFileURL.swift
      - Sources/IlliquidCore/Player/ThumbnailPolicy.swift
      - Tests/IlliquidAppTests/ThumbnailSingletonNeighborhoodTests.swift
      - Tests/IlliquidAppTests/ThumbnailPlaylistNeighborhoodTests.swift
      - Benchmarks/ThumbnailPlaylistNeighborhood/**
      - .github/workflows/thumbnail-playlist-neighborhood.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thumbnail-playlist-neighborhood-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify outputs and measure both source variants
        run: |
          test ! -e /Volumes/seed1/Projects/kyoto/kyoto.py
          echo "Kyoto is unavailable on this hosted runner; all component builds run serially."
          python3 Benchmarks/ThumbnailPlaylistNeighborhood/run.py \
            --output "$RUNNER_TEMP/thumbnail-neighborhood" --pairs 8 --target-ms 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-neighborhood-component
          path: |
            ${{ runner.temp }}/thumbnail-neighborhood/*.json
            ${{ runner.temp }}/thumbnail-neighborhood/*.jsonl
            ${{ runner.temp }}/thumbnail-neighborhood/logs/
            ${{ runner.temp }}/thumbnail-neighborhood/sources/
            ${{ runner.temp }}/thumbnail-neighborhood/binaries/
          retention-days: 30

  native-app-regressions:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          test ! -e /Volumes/seed1/Projects/kyoto/kyoto.py
          echo "Kyoto is unavailable on this hosted runner; native builds run serially."
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build app graph and run thumbnail regressions
        run: |
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'ThumbnailPlaylistNeighborhoodTests|ThumbnailSingletonNeighborhoodTests|ThumbnailBackgroundSchedulerTests|ThumbnailLifecycleRegressionTests' \
            2>&1 | tee "$RUNNER_TEMP/thumbnail-neighborhood-app-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thumbnail-neighborhood-app-regressions
          path: ${{ runner.temp }}/thumbnail-neighborhood-app-tests.log
          retention-days: 30
