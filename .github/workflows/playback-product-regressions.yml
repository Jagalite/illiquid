name: Playback product regressions
on:
  push:
    branches: [feat/playback-reliability-tools]
  pull_request:
    branches: [main, fix/track-restoration-thumbnail-lifecycle]
permissions:
  contents: read
concurrency:
  group: playback-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture reviewed source and revision
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git archive --format=tar HEAD Sources Tests Scripts Documentation Validation Package.swift Package.resolved .github > evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-product-source
          path: evidence/
          retention-days: 7
  macos-regressions:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate local product fixtures
        run: |
          bash Scripts/generate-product-fixtures.sh "$RUNNER_TEMP/illiquid-product-fixtures"
          echo "ILLIQUID_PRODUCT_FIXTURES=$RUNNER_TEMP/illiquid-product-fixtures" >> "$GITHUB_ENV"
          echo "ILLIQUID_NATIVE_FIXTURE_DIR=$RUNNER_TEMP/illiquid-product-fixtures" >> "$GITHUB_ENV"
      - name: Inspect App Intents build tooling
        run: |
          mkdir -p evidence
          xcrun appintentsmetadataprocessor --help > evidence/appintents-tool-help.txt 2>&1 || true
          xcrun swiftc -frontend -help-hidden > evidence/swift-frontend-help.txt
      - name: Build and run product and lifecycle regressions
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          swift --version > evidence/toolchain.txt
          swift test --force-resolved-versions --no-parallel --filter \
            'PlaybackCoordinatorTests|TrackRestorationRegressionTests|InterruptedMigrationRegressionTests|ThumbnailSchedulingPolicyRegressionTests|ThumbnailLifecycleRegressionTests|ThumbnailBackgroundSchedulerTests|PlaybackProduct|CaptionNavigation|PlaybackAutomation|MediaPlaybackSettings|PlaybackPersistence|AudioDelayTests|RuntimeAuthorityFenceTests|NativePictureInPictureTransitionTests|RendererObservationBoundsTests|SubtitleSeekRegressionTests' \
            2>&1 | tee evidence/swift-test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-product-macos
          path: evidence/
          retention-days: 14
