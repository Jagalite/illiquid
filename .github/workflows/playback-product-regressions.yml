name: Playback product regressions
on:
  push:
    branches: [feat/recovery-captions-automation]
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Scripts/**'
      - '.github/workflows/playback-product-regressions.yml'
permissions:
  contents: read
concurrency:
  group: playback-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive source for reproducible review
        run: |
          git rev-parse HEAD > REVIEW_REVISION.txt
          tar -czf review-source.tar.gz Sources Tests Scripts Documentation Validation Package.swift Package.resolved .github REVIEW_REVISION.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source
          path: review-source.tar.gz
          retention-days: 7
  native-product:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build and test product graph
        run: |
          set -o pipefail
          swift test --force-resolved-versions --no-parallel --filter 'IlliquidCoreTests|IlliquidPlayerTests|IlliquidPlaybackCoreTests|IlliquidAppTests' 2>&1 | tee product-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-tests
          path: product-tests.log
          retention-days: 14
