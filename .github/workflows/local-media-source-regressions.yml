name: Local media source regressions
on:
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Player/MediaSource.swift'
      - 'Tests/IlliquidCoreTests/LocalMediaSourceValidationTests.swift'
      - 'Scripts/test-local-media-source-regressions.sh'
      - '.github/workflows/local-media-source-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-media-source-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-validation:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift --version
      - name: Debug regressions
        run: bash Scripts/test-local-media-source-regressions.sh --jobs 2 -Xswiftc -warnings-as-errors
      - name: Release regressions
        run: bash Scripts/test-local-media-source-regressions.sh -c release --jobs 2 -Xswiftc -warnings-as-errors
