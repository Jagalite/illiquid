name: Track selection rank portable qualification
on:
  push:
    branches: ['research/compact-track-rank-portable']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-rank-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-component:
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    timeout-minutes: 20
    env:
      TRACK_RANK_BASELINE: ea2ff568237e2667f7b1aeee67b11a44ebe95b72
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record portable environment and fetch the exact comparison baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
          mkdir -p "$RUNNER_TEMP/track-selection-ranking"
          uname -a > "$RUNNER_TEMP/track-selection-ranking/system.txt"
          swiftc --version >> "$RUNNER_TEMP/track-selection-ranking/system.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/track-selection-ranking/revision.txt"
          git fetch --no-tags --depth=1 origin "$TRACK_RANK_BASELINE"
          git diff --check "$TRACK_RANK_BASELINE" HEAD --
      - name: Check baseline and candidate in debug and release
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling serially in this isolated checkout.'
          python3 Benchmarks/TrackSelectionRanking/run.py test --baseline-ref "$TRACK_RANK_BASELINE" --configuration debug --output "$RUNNER_TEMP/track-selection-ranking/debug"
          python3 Benchmarks/TrackSelectionRanking/run.py test --baseline-ref "$TRACK_RANK_BASELINE" --configuration release --output "$RUNNER_TEMP/track-selection-ranking/release"
      - name: Compare complete selected-ID receipts and portable paired timings
        run: |
          python3 Benchmarks/TrackSelectionRanking/run.py benchmark --baseline-ref "$TRACK_RANK_BASELINE" --rounds 10 --target-ms 50 --output "$RUNNER_TEMP/track-selection-ranking/benchmark"
          cat "$RUNNER_TEMP/track-selection-ranking/benchmark/summary.json"
      - name: Publish compact research receipt
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "track-selection-ranking"
          bench = root / "benchmark"
          receipt = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "head_sha": os.environ["GITHUB_SHA"],
              "system": (root / "system.txt").read_text(),
              "manifest": json.loads((bench / "manifest.json").read_text()),
              "summary": json.loads((bench / "summary.json").read_text()),
              "measurements": [json.loads(row) for row in (bench / "measurements.jsonl").read_text().splitlines()],
              "calibration": [json.loads(row) for row in (bench / "calibration.jsonl").read_text().splitlines()],
              "iteration_counts": json.loads((bench / "iteration-counts.json").read_text()),
              "verification": {
                  "comparisons": json.loads((bench / "verification.json").read_text())["comparisons"],
                  "receipt_sha256": hashlib.sha256((bench / "verification.json").read_bytes()).hexdigest(),
              },
              "builds": {variant: json.loads((bench / "build" / variant / "manifest.json").read_text())
                         for variant in ("baseline", "candidate")},
              "tests": {
                  f"{configuration}/{variant}": {
                      "manifest": json.loads((root / configuration / f"{variant}-{configuration}" / "manifest.json").read_text()),
                      "log": (root / configuration / f"{variant}-{configuration}" / "tests.log").read_text(),
                  } for configuration in ("debug", "release") for variant in ("baseline", "candidate")
              },
          }
          payload = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          (root / "research-receipt.json").write_text(payload + "\n")
          print("TRACK_RANK_RECEIPT_BEGIN")
          for offset in range(0, len(payload), 16000):
              print(payload[offset:offset + 16000])
          print("TRACK_RANK_RECEIPT_END")
          PY
      - name: Collect portable source and result receipts
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "track-selection-ranking"
          destination = root.parent / "track-rank-portable-receipts"
          for path in root.rglob('*'):
              if path.is_file() and (path.suffix in {".json", ".jsonl", ".log", ".txt"} or "inputs" in path.parts):
                  target = destination / path.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, target)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: track-selection-ranking-portable
          path: ${{ runner.temp }}/track-rank-portable-receipts/
          retention-days: 30
