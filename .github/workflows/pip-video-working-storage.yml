name: PiP video working storage lifetime

on:
  push:
    branches: ['perf/pip-video-storage-retirement-20261028']
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/PiPSubtitleCompositor.swift'
      - 'Tests/IlliquidNativePlaybackTests/PiPSubtitlePipelineTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PiPVideoWorkingStorageMeasurements.swift'
      - 'Benchmarks/PiPVideoWorkingStorage/run.py'
      - '.github/workflows/pip-video-working-storage.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Presentation/PiPSubtitleCompositor.swift'
      - 'Sources/IlliquidNativePlayback/Presentation/PiPSubtitleUploadCache.swift'
      - 'Sources/IlliquidNativePlayback/Resources/NativePlaybackShaders.metal'
      - 'Tests/IlliquidNativePlaybackTests/PiPSubtitlePipelineTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/PiPVideoWorkingStorageMeasurements.swift'
      - 'Benchmarks/PiPVideoWorkingStorage/run.py'
      - '.github/workflows/pip-video-working-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-video-working-storage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-lifetime:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the benchmark driver
        run: python3 -m py_compile Benchmarks/PiPVideoWorkingStorage/run.py
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Compare native lifetime, memory and paused reentry
        if: github.event_name != 'pull_request'
        run: |
          python3 Benchmarks/PiPVideoWorkingStorage/run.py \
            --pairs 6 \
            --output "$RUNNER_TEMP/pip-video-working-storage" \
            --regression-filter 'PiPSubtitlePipelineTests|PiPSubtitleUploadReuseTests|PiPVideoMappingTests|PiPSubtitleCompositionPolicyTests|MetalASSSubtitleCompositorTests'
      - name: Qualify PiP pixels, ownership and lifecycle
        if: github.event_name == 'pull_request'
        run: |
          echo "Kyoto is unavailable on this ephemeral GitHub-hosted runner; building directly with serialized tests."
          mkdir -p "$RUNNER_TEMP/pip-video-working-storage"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'PiPSubtitlePipelineTests|PiPSubtitleUploadReuseTests|PiPVideoMappingTests|PiPSubtitleCompositionPolicyTests|MetalASSSubtitleCompositorTests' \
            2>&1 | tee "$RUNNER_TEMP/pip-video-working-storage/regressions.log"
      - name: Collect reproducible evidence without build products
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'pip-video-working-storage'
          destination = Path(os.environ['RUNNER_TEMP']) / 'pip-video-working-storage-evidence'
          destination.mkdir(parents=True, exist_ok=True)
          for directory, children, names in os.walk(root):
              children[:] = sorted(name for name in children if name not in {'build', '.build', '__pycache__'})
              for name in sorted(names):
                  path = Path(directory) / name
                  target = destination / path.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pip-video-working-storage-evidence
          path: ${{ runner.temp }}/pip-video-working-storage-evidence/
          retention-days: 14
