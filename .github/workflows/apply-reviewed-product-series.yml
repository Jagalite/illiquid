name: Validate reviewed product series
on:
  push:
    branches: [work/illiquid-product-review]
    paths: ['ReviewWork/plan.json']
permissions:
  contents: write
concurrency:
  group: reviewed-illiquid-product-series
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/recovery-captions-automation
          path: product
          fetch-depth: 0
      - name: Apply and review exact patch series
        working-directory: product
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path('../transport/ReviewWork').resolve()
          def read(name):
              path = (root / name).resolve()
              if not path.is_relative_to(root):
                  raise SystemExit('Patch must be in ReviewWork')
              return path.read_bytes()
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, **kwargs)
          plan = json.loads(read('plan.json'))
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != plan['base_sha']:
              raise SystemExit('Feature branch changed; refusing another base')
          run('git', 'config', 'user.name', 'Jaga Tranvo')
          run('git', 'config', 'user.email', '8354941+Jagalite@users.noreply.github.com')
          assert 1 <= len(plan['patches']) <= 30
          for entry in plan['patches']:
              source = json.loads(read(entry['source']))
              patch = source['patches'][entry['index']] if 'index' in entry else source
              encoded = patch['gzip_base64']
              for old, new in entry.get('base64_replacements', []):
                  assert encoded.count(old) == 1
                  encoded = encoded.replace(old, new)
              decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert len(decoded) < 2000000
              assert hashlib.sha256(decoded).hexdigest() == patch['sha256']
              run('git', 'apply', '--check', input=decoded)
              run('git', 'apply', '--index', input=decoded)
              for fixup in entry.get('fixups', []):
                  data = read(fixup)
                  run('git', 'apply', '--check', input=data)
                  run('git', 'apply', '--index', input=data)
              run('git', 'diff', '--cached', '--check')
              run('bash', 'Scripts/test-product-regressions.sh')
              run('git', 'commit', '--no-gpg-sign', '-m', patch['subject'])
              run('git', 'show', '--check', '--stat', 'HEAD')
          run('git', 'diff', '--check', plan['base_sha'], 'HEAD')
          pathlib.Path('REVIEW_REVISION.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'], text=True))
          PY
      - name: Prepare pinned native dependencies
        working-directory: product
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
          xcrun appintentsmetadataprocessor --help > appintents-tool-help.txt 2>&1 || true
          xcrun swiftc -help-hidden > swiftc-help.txt
          python3 - <<'PY'
          import pathlib, re, subprocess
          sdk = pathlib.Path(subprocess.check_output(['xcrun','--show-sdk-path'],text=True).strip())
          files = list((sdk/'System/Library/Frameworks/AppIntents.framework/Modules/AppIntents.swiftmodule').glob('arm64e-apple-macos.swiftinterface'))
          if not files:
              files = list((sdk/'System/Library/Frameworks/AppIntents.framework/Modules/AppIntents.swiftmodule').glob('*.swiftinterface'))
          if files:
              lines = files[0].read_text().splitlines()
              out=[]
              for i,line in enumerate(lines):
                  if re.search(r'(struct IntentFile|protocol AppIntent[ :]|protocol AppEntity[ :]|protocol EntityQuery[ :]|protocol ReturnsValue[ :]|func result.*value:)',line):
                      out.extend(lines[max(0,i-2):i+90])
              pathlib.Path('appintents-api.txt').write_text('\n'.join(out))
          PY
      - name: Native application build and product regression tests
        working-directory: product
        run: |
          set -o pipefail
          swift test --force-resolved-versions --no-parallel --filter 'IlliquidCoreTests|IlliquidPlayerTests|IlliquidPlaybackCoreTests|IlliquidAppTests|CaptionTranscript' 2>&1 | tee product-tests.log
          bash Scripts/test-restoration-regressions.sh
          python3 -m unittest discover -s Validation/ReleaseQualification -p 'test_*.py' -v
      - name: Publish tested commits to feature branch only
        working-directory: product
        run: |
          git push origin HEAD:refs/heads/feat/recovery-captions-automation
          git rev-parse HEAD
      - name: Collect candidate source and test evidence
        if: always()
        working-directory: product
        run: |
          git rev-parse HEAD > REVIEW_REVISION.txt
          tar -czf candidate-source.tar.gz Sources Tests Scripts Documentation Validation Package.swift Package.resolved .github Resources README.md REVIEW_REVISION.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-product-candidate
          path: |
            product/candidate-source.tar.gz
            product/product-tests.log
            product/appintents-tool-help.txt
            product/appintents-api.txt
            product/swiftc-help.txt
            product/REVIEW_REVISION.txt
          retention-days: 14
