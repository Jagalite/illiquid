name: Relative seek effect lifetime

on:
  pull_request:
    paths:
      - Sources/IlliquidPlayer/Player/PlaybackRuntimeDriver.swift
      - Sources/IlliquidPlaybackCore/**
      - Sources/IlliquidPlayback/**
      - Tests/IlliquidPlayerTests/RelativeSeekEffectLifetimeTests.swift
      - Benchmarks/RelativeSeekCoalescing/**
      - .github/workflows/relative-seek-lifetime.yml
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Matched baseline commit for the manual performance comparison
        required: true
        type: string
        default: 8c3cc3d4008d5d1b8d436bcf2d51d891382b6548

permissions:
  contents: read

concurrency:
  group: relative-seek-lifetime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-runtime:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the production driver in debug and release
        run: |
          python3 Benchmarks/RelativeSeekCoalescing/run.py test --configuration debug --output "$RUNNER_TEMP/seek-debug"
          python3 Benchmarks/RelativeSeekCoalescing/run.py test --configuration release --output "$RUNNER_TEMP/seek-release"
      - name: Measure matched driver workloads with macOS frameworks
        if: github.event_name == 'workflow_dispatch'
        env:
          RELATIVE_SEEK_BASE: ${{ inputs.baseline_ref }}
        run: |
          python3 Benchmarks/RelativeSeekCoalescing/run.py build --source-ref "$RELATIVE_SEEK_BASE" --output "$RUNNER_TEMP/seek-baseline-build"
          python3 Benchmarks/RelativeSeekCoalescing/run.py build --output "$RUNNER_TEMP/seek-candidate-build"
          python3 Benchmarks/RelativeSeekCoalescing/measure.py --baseline-build "$RUNNER_TEMP/seek-baseline-build" --candidate-build "$RUNNER_TEMP/seek-candidate-build" --output "$RUNNER_TEMP/seek-measurements" --bursts 0,32,256,2048,8192 --repeats 4 --ticks 2048
          python3 - "$RUNNER_TEMP/seek-measurements/summary.json" <<'PY'
          import json, sys
          for row in json.load(open(sys.argv[1])):
              variants = row['variants']
              print(json.dumps({
                  'relative_seek_commands': row['relative_seek_commands'],
                  'baseline_clock_ns': variants['baseline']['clock_event_mean_ns'],
                  'candidate_clock_ns': variants['candidate']['clock_event_mean_ns'],
                  'baseline_burst_ns': variants['baseline']['burst_elapsed_ns'],
                  'candidate_burst_ns': variants['candidate']['burst_elapsed_ns'],
              }, sort_keys=True))
          PY
      - name: Verify retired callbacks outside the timing cohort
        if: github.event_name == 'workflow_dispatch'
        run: |
          for burst in 0 32 256 2048 8192; do
            "$RUNNER_TEMP/seek-candidate-build/RelativeSeekBenchmark" --burst "$burst" --ticks 64 --verify > "$RUNNER_TEMP/seek-measurements/verify-$burst.json"
          done
          "$RUNNER_TEMP/seek-candidate-build/RelativeSeekBenchmark" --burst 32 --ticks 64 --verify --paused > "$RUNNER_TEMP/seek-measurements/verify-paused-32.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relative-seek-focused-evidence
          path: |
            ${{ runner.temp }}/seek-debug/
            ${{ runner.temp }}/seek-release/
            ${{ runner.temp }}/seek-measurements/
            ${{ runner.temp }}/seek-baseline-build/manifest.json
            ${{ runner.temp }}/seek-baseline-build/commands.jsonl
            ${{ runner.temp }}/seek-candidate-build/manifest.json
            ${{ runner.temp }}/seek-candidate-build/commands.jsonl
          retention-days: 7

  app-integration:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the existing native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and test driver and coordinator behavior
        run: |
          swift test --force-resolved-versions --filter 'RelativeSeekEffectLifetimeTests|PlaybackCoordinatorTests'
