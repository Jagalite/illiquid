name: Bitmap subtitle lookup qualification

on:
  push:
    branches: ['perf/bitmap-subtitle-lookup']
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Subtitles/BitmapSubtitleTimeline.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/SubtitleMemoryBudget.swift'
      - 'Sources/IlliquidNativePlayback/Subtitles/LibassContext.swift'
      - 'Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineLookupTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineOrderingTests.swift'
      - 'Tests/IlliquidNativePlaybackTests/SubtitleMemoryBudgetAccountingTests.swift'
      - 'Benchmarks/BitmapSubtitleLookup/**'
      - 'Benchmarks/BitmapSubtitleTimeline/run.py'
      - '.github/workflows/bitmap-subtitle-lookup.yml'
      - '!Benchmarks/BitmapSubtitleLookup/README.md'
      - '!Benchmarks/BitmapSubtitleLookup/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-subtitle-lookup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build coordination
        run: |
          test ! -e /Volumes/seed1/Projects/kyoto/kyoto.py
          echo "The shared Kyoto queue is unavailable on this GitHub-hosted runner; isolated builds run directly and serially."
      - name: Baseline and candidate debug and release regressions
        run: |
          python3 Benchmarks/BitmapSubtitleLookup/run.py --tests-only \
            --output "$RUNNER_TEMP/bitmap-subtitle-lookup/tests"
      - name: Paired native component measurements
        run: |
          python3 Benchmarks/BitmapSubtitleLookup/run.py \
            --pairs 12 --target-ms 40 --max-sample-ms 800 \
            --output "$RUNNER_TEMP/bitmap-subtitle-lookup/timing"
      - name: Emit review evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "bitmap-subtitle-lookup"
          files = {str(p.relative_to(root)): p.read_text()
                   for p in sorted(root.rglob("*")) if p.is_file() and "build" not in p.parts}
          review = {name: value for name, value in files.items() if "/receipts/" not in name}
          print("LOOKUP_REVIEW_JSON " + json.dumps(review, sort_keys=True))
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          print("LOOKUP_BUNDLE_SHA256 " + hashlib.sha256(packed).hexdigest())
          print("LOOKUP_BUNDLE_BASE64 " + base64.b64encode(packed).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitmap-subtitle-lookup-macos
          path: ${{ runner.temp }}/bitmap-subtitle-lookup/
          retention-days: 14
