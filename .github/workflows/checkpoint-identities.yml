name: Shuffled checkpoint identities

on:
  push:
    branches: ['perf/checkpoint-identities-*']
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidPlayer/Player/PlaybackController.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCoordinatorTests.swift'
      - 'Benchmarks/CheckpointIdentities/Harness.swift'
      - 'Benchmarks/CheckpointIdentities/run.py'
      - 'Scripts/check-ci-whitespace.py'
      - 'Scripts/test-check-ci-whitespace.py'
      - 'Scripts/tests/benchmark-source-policy-tests.py'
      - '.github/workflows/checkpoint-identities.yml'
  pull_request:
    paths:
      - 'Sources/IlliquidCore/Playlist/**'
      - 'Sources/IlliquidCore/Utilities/NormalizedFileURL.swift'
      - 'Sources/IlliquidCore/Utilities/NaturalFilenameOrdering.swift'
      - 'Sources/IlliquidPlayer/Player/PlaybackController.swift'
      - 'Tests/IlliquidCoreTests/Playlist*Tests.swift'
      - 'Tests/IlliquidPlayerTests/PlaybackCoordinatorTests.swift'
      - 'Benchmarks/CheckpointIdentities/Harness.swift'
      - 'Benchmarks/CheckpointIdentities/run.py'
      - 'Scripts/check-ci-whitespace.py'
      - 'Scripts/test-check-ci-whitespace.py'
      - 'Scripts/tests/benchmark-source-policy-tests.py'
      - '.github/workflows/checkpoint-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-identities-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test benchmark source policies without compilation
        run: python3 -B Scripts/tests/benchmark-source-policy-tests.py
      - name: Test whitespace comparison policy without compilation
        run: python3 -B Scripts/test-check-ci-whitespace.py
      - name: Check changed-line whitespace and record comparison provenance
        run: >-
          python3 Scripts/check-ci-whitespace.py
          --output "$RUNNER_TEMP/checkpoint-identities-whitespace.json"
      - name: Qualify checkpoint identities (manual runs also measure)
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; compiling isolated packages serially.'
          mode=()
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            mode+=(--regression-only)
          fi
          python3 Benchmarks/CheckpointIdentities/run.py "${mode[@]}" \
            --pairs 12 --target-ms 150 \
            --output "$RUNNER_TEMP/checkpoint-identities"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-identities-component
          path: |
            ${{ runner.temp }}/checkpoint-identities-whitespace.json
            ${{ runner.temp }}/checkpoint-identities/
            !${{ runner.temp }}/checkpoint-identities/build/**
            !${{ runner.temp }}/checkpoint-identities/module-cache/**
            !${{ runner.temp }}/checkpoint-identities/swiftpm-cache/**
          retention-days: 30

  coordinator:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if test -f /Volumes/seed1/Projects/kyoto/kyoto.py; then
            echo 'Kyoto is available; submit this qualification through the shared queue.'
            exit 1
          fi
          echo 'Kyoto is unavailable on this ephemeral runner; building in this isolated checkout.'
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build the app graph and test shuffled checkpoint save and relaunch
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-native"
          git rev-parse HEAD > "$RUNNER_TEMP/checkpoint-native/head.txt"
          swift --version > "$RUNNER_TEMP/checkpoint-native/toolchain.txt"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'shuffledProgressCheckpointReconcilesEditedPlaylistIdentities|shuffledCheckpointPersistsEditedBaseOrderAcrossRelaunch|shuffleRestoresBaseOrderAcrossRelaunch|unshuffleRetainsAdditionsAndOmitsRemovedEntries' \
            2>&1 | tee "$RUNNER_TEMP/checkpoint-native/tests.log"
          python3 - "$RUNNER_TEMP/checkpoint-native/tests.log" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          names = [
              "shuffledProgressCheckpointReconcilesEditedPlaylistIdentities",
              "shuffledCheckpointPersistsEditedBaseOrderAcrossRelaunch",
              "shuffleRestoresBaseOrderAcrossRelaunch",
              "unshuffleRetainsAdditionsAndOmitsRemovedEntries",
          ]
          for name in names:
              assert any(name in line and "passed" in line for line in log.splitlines()), name
          print("Checkpoint coordinator qualification: all four named tests executed and passed.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint-identities-coordinator
          path: ${{ runner.temp }}/checkpoint-native/
          retention-days: 30
