name: Auxiliary input font payload memory

on:
  push:
    branches: ['perf/auxiliary-font-payloads-20261023']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/**'
      - 'Tests/IlliquidNativePlaybackTests/AuxiliaryFontPayloadTests.swift'
      - 'Benchmarks/AuxiliaryFontPayloads/**'
      - '.github/workflows/auxiliary-font-payloads.yml'
      - '!Benchmarks/AuxiliaryFontPayloads/*.md'
      - '!Benchmarks/AuxiliaryFontPayloads/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/FFmpegDemuxer.swift'
      - 'Sources/IlliquidNativePlayback/Media/FFmpegInputExecutor.swift'
      - 'Sources/IlliquidNativePlayback/Media/MediaSession.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeFrameStepReader.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeThumbnailMetadataReader.swift'
      - 'Sources/IlliquidNativePlayback/Media/NativeTimelineThumbnailGenerator.swift'
      - 'Tests/IlliquidNativePlaybackTests/AuxiliaryFontPayloadTests.swift'
      - 'Benchmarks/AuxiliaryFontPayloads/**'
      - '.github/workflows/auxiliary-font-payloads.yml'
      - '!Benchmarks/AuxiliaryFontPayloads/*.md'
      - '!Benchmarks/AuxiliaryFontPayloads/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auxiliary-font-payloads-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-memory:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate native media and attachment fixtures
        run: |
          python3 Benchmarks/AuxiliaryFontPayloads/generate-fixtures.py \
            --output "$RUNNER_TEMP/auxiliary-font-fixtures"
      - name: Verify exact-source semantics and measure retained allocations
        run: |
          python3 Benchmarks/AuxiliaryFontPayloads/run.py \
            --fixtures "$RUNNER_TEMP/auxiliary-font-fixtures" \
            --output "$RUNNER_TEMP/auxiliary-font-results" --pairs 6
      - name: Emit transferable evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'auxiliary-font-results'
          files = {str(p.relative_to(root)): p.read_text()
                   for p in sorted(root.rglob('*'))
                   if p.is_file() and p.suffix in {'.json', '.jsonl', '.log', '.txt'}
                   and not any(x in {'build', 'module-cache'} for x in p.relative_to(root).parts)}
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds the log bundle limit; retrieve the artifact')
          print('AUXILIARY_FONT_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('AUXILIARY_FONT_BASE64 ' + base64.b64encode(packed).decode())
          for name in ['summary.json', 'parity.json']:
              if name in files:
                  print(name + '\n' + files[name])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auxiliary-font-payload-memory
          path: |
            ${{ runner.temp }}/auxiliary-font-results/**/*.json
            ${{ runner.temp }}/auxiliary-font-results/**/*.jsonl
            ${{ runner.temp }}/auxiliary-font-results/**/*.log
            ${{ runner.temp }}/auxiliary-font-results/**/*.swift
            ${{ runner.temp }}/auxiliary-font-results/**/*.h
            ${{ runner.temp }}/auxiliary-font-results/**/*.py
            ${{ runner.temp }}/auxiliary-font-results/**/*.modulemap
            !${{ runner.temp }}/auxiliary-font-results/module-cache/**
          retention-days: 14

  native-integration:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate required mixed and real-font fixtures
        run: |
          python3 Benchmarks/AttachmentAdmission/generate-fixtures.py \
            --output "$RUNNER_TEMP/attachment-admission-fixtures"
          python3 Benchmarks/AuxiliaryFontPayloads/generate-fixtures.py \
            --output "$RUNNER_TEMP/auxiliary-font-fixtures"
      - name: Build application graph and qualify input consumers and font rendering
        run: |
          evidence="$RUNNER_TEMP/auxiliary-font-integration"
          mkdir -p "$evidence"
          sw_vers > "$evidence/host.txt"
          swift --version >> "$evidence/host.txt"
          git rev-parse HEAD >> "$evidence/host.txt"
          export ILLIQUID_ATTACHMENT_ADMISSION_FIXTURE="$RUNNER_TEMP/attachment-admission-fixtures/attachment-admission.mkv"
          export ILLIQUID_AUXILIARY_REAL_FONT_FIXTURE="$RUNNER_TEMP/auxiliary-font-fixtures/real-font.mkv"
          export ILLIQUID_AUXILIARY_REAL_FONT_FILE="$GITHUB_WORKSPACE/TestFixtures/Fonts/NotoSans-Regular.ttf"
          test -s "$ILLIQUID_ATTACHMENT_ADMISSION_FIXTURE"
          test -s "$ILLIQUID_AUXILIARY_REAL_FONT_FIXTURE"
          test -s "$ILLIQUID_AUXILIARY_REAL_FONT_FILE"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'AuxiliaryFontPayloadTests|FontAttachmentAdmissionTests|NativePlaybackFoundationTests|InputReadFailureTests|ThumbnailPlaybackAdmissionTests|ThumbnailPacketWindowTests|NativeThumbnailCacheTests' \
            2>&1 | tee "$evidence/native-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auxiliary-font-payload-integration
          path: ${{ runner.temp }}/auxiliary-font-integration/
          retention-days: 14
