name: Bitmap subtitle timeline performance

on:
  push:
    branches: [perf/bitmap-subtitle-timeline-insertion]
    paths:
      - Sources/IlliquidNativePlayback/Subtitles/**
      - Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineOrderingTests.swift
      - Tests/IlliquidNativePlaybackTests/SubtitleMemoryBudgetAccountingTests.swift
      - Benchmarks/BitmapSubtitleTimeline/**
      - .github/workflows/bitmap-subtitle-timeline-performance.yml
      - '!Benchmarks/BitmapSubtitleTimeline/README.md'
      - '!Benchmarks/BitmapSubtitleTimeline/evidence/**'
  pull_request:
    paths:
      - Sources/IlliquidNativePlayback/Subtitles/**
      - Tests/IlliquidNativePlaybackTests/BitmapSubtitleTimelineOrderingTests.swift
      - Tests/IlliquidNativePlaybackTests/SubtitleMemoryBudgetAccountingTests.swift
      - Benchmarks/BitmapSubtitleTimeline/**
      - .github/workflows/bitmap-subtitle-timeline-performance.yml
      - '!Benchmarks/BitmapSubtitleTimeline/README.md'
      - '!Benchmarks/BitmapSubtitleTimeline/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmap-subtitle-timeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify baseline and candidate in debug and release
        run: |
          python3 Benchmarks/BitmapSubtitleTimeline/run.py --tests-only \
            --output "$RUNNER_TEMP/bitmap-subtitle-timeline/tests"
      - name: Measure paired native components
        run: |
          python3 Benchmarks/BitmapSubtitleTimeline/run.py \
            --pairs 8 --target-ms 80 --max-sample-ms 1500 \
            --output "$RUNNER_TEMP/bitmap-subtitle-timeline/timing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bitmap-subtitle-timeline-macos
          path: ${{ runner.temp }}/bitmap-subtitle-timeline
          retention-days: 14
