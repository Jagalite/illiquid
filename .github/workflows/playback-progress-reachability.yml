name: Playback progress predecessor indexing (native)

on:
  push:
    branches: [perf/progress-reachability-c836a0c4]
    paths:
      - .github/workflows/playback-progress-reachability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-progress-reachability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check baseline and candidate state-space suites in debug and release
        run: |
          python3 Benchmarks/PlaybackProgressReachability/run.py test --configuration debug \
            --baseline-ref 4077f8ad538dd8ed911b38c9b300a98c787c5135 --output "$RUNNER_TEMP/playback-progress/debug"
          python3 Benchmarks/PlaybackProgressReachability/run.py test --configuration release \
            --baseline-ref 4077f8ad538dd8ed911b38c9b300a98c787c5135 --output "$RUNNER_TEMP/playback-progress/release"
      - name: Compare complete progress reports and paired analyzer timings
        run: |
          python3 Benchmarks/PlaybackProgressReachability/run.py benchmark --rounds 10 --target-ms 100 \
            --baseline-ref 4077f8ad538dd8ed911b38c9b300a98c787c5135 --output "$RUNNER_TEMP/playback-progress/benchmark"
      - name: Retain complete research receipts
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"]) / "playback-progress"
          root.mkdir(parents=True, exist_ok=True)
          members = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              relative = path.relative_to(root)
              if "cache" in relative.parts or ".build" in relative.parts:
                  continue
              if "build" in relative.parts:
                  if path.name not in ("manifest.json", "build-module.log", "build-harness.log", "build-IlliquidCore.log", "build-IlliquidPlaybackCore.log"):
                      continue
              elif "inputs" not in relative.parts and path.suffix not in (".json", ".jsonl", ".log", ".txt", ".patch"):
                  continue
              data = path.read_bytes()
              members.append({"path": relative.as_posix(), "bytes": len(data),
                              "sha256": hashlib.sha256(data).hexdigest()})
          manifest = root / "archive-members.json"
          manifest.write_text(json.dumps(members, indent=2, sort_keys=True) + "\n")
          archive = root.parent / "playback-progress-receipts.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as output:
              for member in members:
                  output.write(root / member["path"], member["path"])
              output.write(manifest, "archive-members.json")
          data = archive.read_bytes()
          print("Receipt archive:", archive.name,
                "sha256=" + hashlib.sha256(data).hexdigest(),
                "bytes=" + str(len(data)))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-progress-native
          path: ${{ runner.temp }}/playback-progress-receipts.zip
          retention-days: 14
