name: Timecode formatting research

on:
  push:
    branches: [perf/timecode-formatting-d27e3]
    paths:
      - Sources/IlliquidApp/UI/PlaybackControlBar.swift
      - Tests/IlliquidAppTests/TimecodeFormatterTests.swift
      - Tests/IlliquidAppTests/UXVerificationProbeTests.swift
      - Benchmarks/TimecodeFormatting/Harness.swift
      - Benchmarks/TimecodeFormatting/run.py
      - .github/workflows/timecode-formatting.yml
  pull_request:
    paths:
      - Sources/IlliquidApp/UI/PlaybackControlBar.swift
      - Tests/IlliquidAppTests/TimecodeFormatterTests.swift
      - Tests/IlliquidAppTests/UXVerificationProbeTests.swift
      - Benchmarks/TimecodeFormatting/Harness.swift
      - Benchmarks/TimecodeFormatting/run.py
      - .github/workflows/timecode-formatting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timecode-formatting-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-component:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify output and measure actual formatter sources
        run: >-
          python3 Benchmarks/TimecodeFormatting/run.py
          --output "$RUNNER_TEMP/timecode-results"
          --pairs 10 --target-ms 250
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timecode-formatting-macos
          path: ${{ runner.temp }}/timecode-results/
          retention-days: 14

  native-app-regressions:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Build app graph and run timecode and UX regressions
        run: |
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'TimecodeFormatterTests|UXVerificationProbeTests' \
            2>&1 | tee "$RUNNER_TEMP/timecode-app-tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timecode-app-regressions
          path: ${{ runner.temp }}/timecode-app-tests.log
          retention-days: 14
