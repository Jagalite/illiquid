name: Runtime lease history

on:
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Runtime/PlaybackRuntimeMetadata.swift'
      - 'Sources/IlliquidPlaybackCore/IdentityAndTime.swift'
      - 'Sources/IlliquidPlaybackCore/EventsAndEffects.swift'
      - 'Sources/IlliquidCore/Player/MediaTrack.swift'
      - 'Tests/IlliquidNativePlaybackTests/RuntimeLeaseHistoryTests.swift'
      - 'Benchmarks/RuntimeLeaseHistory/run.py'
      - 'Benchmarks/RuntimeLeaseHistory/Harness.swift'
      - 'Benchmarks/RuntimeLeaseHistory/CLeaseHeap/**'
      - '.github/workflows/runtime-lease-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-lease-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record native environment
        run: |
          mkdir -p "$RUNNER_TEMP/lease-history-component"
          sw_vers > "$RUNNER_TEMP/lease-history-component/host.txt"
          uname -a >> "$RUNNER_TEMP/lease-history-component/host.txt"
          sysctl -n machdep.cpu.brand_string >> "$RUNNER_TEMP/lease-history-component/host.txt"
          swift --version >> "$RUNNER_TEMP/lease-history-component/host.txt"
      - name: Qualify exact production bookkeeping and measure paired runs
        run: |
          python3 Benchmarks/RuntimeLeaseHistory/run.py all \
            --output "$RUNNER_TEMP/lease-history-component/results" \
            --pairs 6 --histories 0,32,128,1024,8192 \
            --cycles 128 --snapshot-calls 16
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-lease-history-component
          path: |
            ${{ runner.temp }}/lease-history-component/
            !${{ runner.temp }}/lease-history-component/results/**/.build/**
            !${{ runner.temp }}/lease-history-component/results/**/cache/**
            !${{ runner.temp }}/lease-history-component/results/**/module-cache/**
          retention-days: 14

  native-lifecycle:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the pinned native SDK
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Generate the existing audio-track replacement fixture
        run: |
          mkdir -p "$RUNNER_TEMP/lease-history-native/fixtures"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=320x180:rate=24' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -f lavfi -i 'sine=frequency=660:sample_rate=48000' \
            -f lavfi -i 'sine=frequency=880:sample_rate=48000' \
            -t 3 -map 0:v -map 1:a -map 2:a -map 3:a \
            -c:v libx264 -preset ultrafast -c:a aac \
            -disposition:a:0 default -disposition:a:1 0 -disposition:a:2 comment \
            -metadata:s:a:0 language=eng -metadata:s:a:0 title=Main \
            -metadata:s:a:1 language=jpn -metadata:s:a:1 title=Alternate \
            -metadata:s:a:2 language=eng -metadata:s:a:2 title=Commentary \
            "$RUNNER_TEMP/lease-history-native/fixtures/multiple-audio-flags.mkv"
          test -s "$RUNNER_TEMP/lease-history-native/fixtures/multiple-audio-flags.mkv"
          ffprobe -v error -show_streams -show_format -of json \
            "$RUNNER_TEMP/lease-history-native/fixtures/multiple-audio-flags.mkv" \
            > "$RUNNER_TEMP/lease-history-native/fixture.json"
      - name: Build the native app graph and test replacement cleanup
        run: |
          export ILLIQUID_NATIVE_FIXTURE_DIR="$RUNNER_TEMP/lease-history-native/fixtures"
          set -o pipefail
          swift test --force-resolved-versions -c release --no-parallel --filter \
            'RuntimeLeaseHistoryTests|RuntimeAuthorityFenceTests|DifferentialHarnessTests|stopDuringInFlightAudioTrackCandidateCannotResurrectSession|shutdownDuringAudioTrackCandidatePreparationReleasesEveryRuntimeLease|rapidRepeatedAudioTrackReplacementsConvergeToLatestSelectionAndReleaseLeases' \
            2>&1 | tee "$RUNNER_TEMP/lease-history-native/tests.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-lease-history-native
          path: ${{ runner.temp }}/lease-history-native/
          retention-days: 14
