name: Source filesystem regressions
on:
  pull_request:
    paths:
      - 'Sources/IlliquidApp/UI/SourceFilesystem*.swift'
      - 'Tests/IlliquidAppTests/SourceFilesystem*.swift'
      - 'Scripts/test-source-filesystem-regressions.sh'
      - '.github/workflows/source-filesystem-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-filesystem-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  event-policy:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test production event policy without the native SDK graph
        run: bash Scripts/test-source-filesystem-regressions.sh --configuration ${{ matrix.configuration }} --jobs 2 -Xswiftc -warnings-as-errors
