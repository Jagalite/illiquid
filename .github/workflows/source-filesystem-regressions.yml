name: Source filesystem recovery regressions
on:
  pull_request:
    paths:
      - 'Sources/IlliquidApp/UI/SourceFilesystem*.swift'
      - 'Tests/IlliquidAppTests/SourceFilesystem*.swift'
      - 'Scripts/test-source-filesystem-regressions.sh'
      - 'Validation/SourceFilesystemRecovery/**'
      - '.github/workflows/source-filesystem-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-filesystem-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-planner:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: swift --version
      - name: Debug planner regressions
        run: bash Scripts/test-source-filesystem-regressions.sh --jobs 2 -Xswiftc -warnings-as-errors
      - name: Release planner regressions
        run: bash Scripts/test-source-filesystem-regressions.sh --jobs 2 --configuration release -Xswiftc -warnings-as-errors
      - name: Baseline parity and recovery invariants
        run: bash Validation/SourceFilesystemRecovery/run.sh
