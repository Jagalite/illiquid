name: Subtitle result memory lifetime

on:
  push:
    branches: ['perf/subtitle-result-lifetime-20261023']
    paths:
      - 'Sources/IlliquidNativePlayback/Media/SubtitleDecoder.swift'
      - 'Tests/IlliquidNativePlaybackTests/SubtitleResultLifetimeTests.swift'
      - 'Benchmarks/SubtitleResultLifetime/**'
      - '.github/workflows/subtitle-result-lifetime.yml'
      - '!Benchmarks/SubtitleResultLifetime/*.md'
      - '!Benchmarks/SubtitleResultLifetime/evidence/**'
  pull_request:
    paths:
      - 'Sources/IlliquidNativePlayback/Media/SubtitleDecoder.swift'
      - 'Sources/CFFmpeg/include/ffmpeg_shim.h'
      - 'Tests/IlliquidNativePlaybackTests/SubtitleResultLifetimeTests.swift'
      - 'Benchmarks/SubtitleResultLifetime/**'
      - '.github/workflows/subtitle-result-lifetime.yml'
      - '!Benchmarks/SubtitleResultLifetime/*.md'
      - '!Benchmarks/SubtitleResultLifetime/evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subtitle-result-lifetime-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-memory:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare pinned native dependencies
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          python3 Scripts/verify-corresponding-source.py DependencySources
          python3 Scripts/install-ci-native-sdk.py
      - name: Compare decoded output and retained native allocations
        run: |
          python3 Benchmarks/SubtitleResultLifetime/run.py \
            --output "$RUNNER_TEMP/subtitle-result-lifetime/component"
      - name: Generate required bitmap subtitle fixtures
        run: |
          python3 Scripts/generate-bitmap-subtitle-fixtures.py \
            "$RUNNER_TEMP/subtitle-result-lifetime/fixtures" --skip-vobsub
          for name in generated-pgs.mkv generated-dvd.mkv generated-dvb.mkv; do
            test -s "$RUNNER_TEMP/subtitle-result-lifetime/fixtures/$name"
          done
      - name: Build the application graph and qualify subtitle lifetimes
        env:
          ILLIQUID_BITMAP_FIXTURE_DIR: ${{ runner.temp }}/subtitle-result-lifetime/fixtures
        run: |
          evidence="$RUNNER_TEMP/subtitle-result-lifetime"
          sw_vers > "$evidence/host.txt"
          uname -a >> "$evidence/host.txt"
          sysctl -n machdep.cpu.brand_string >> "$evidence/host.txt"
          swift --version >> "$evidence/host.txt"
          git rev-parse HEAD >> "$evidence/host.txt"
          set -o pipefail
          swift test --force-resolved-versions -c release --jobs 2 --no-parallel \
            --filter 'SubtitleResultLifetimeTests|BitmapSubtitleTests|PGSSubtitleCropTests|PGSSubtitlePacketBorrowTests|SubtitleMemoryBudgetAccountingTests' \
            2>&1 | tee "$evidence/native-tests.log"
      - name: Emit reviewable evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'subtitle-result-lifetime'
          files = {}
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if (path.is_file() and path.suffix in {'.json', '.jsonl', '.log', '.txt'}
                      and not any(part in {'build', 'module-cache', 'cache', '.build'} for part in relative.parts)):
                  files[str(relative)] = path.read_text()
              elif path.is_file() and path.name.endswith('.bin.gz'):
                  files[str(relative) + '.base64'] = base64.b64encode(path.read_bytes()).decode()
          packed = gzip.compress(json.dumps(files, sort_keys=True).encode(), compresslevel=9, mtime=0)
          if len(packed) > 2 * 1024 * 1024:
              raise SystemExit('Evidence exceeds the log bundle limit; use the uploaded artifact')
          print('SUBTITLE_LIFETIME_SHA256 ' + hashlib.sha256(packed).hexdigest())
          print('SUBTITLE_LIFETIME_BASE64 ' + base64.b64encode(packed).decode())
          for name, value in files.items():
              if name.endswith(('summary.json', 'parity.json', 'completion.json')):
                  print(name + '\n' + value)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: subtitle-result-lifetime-native
          path: |
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.json
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.jsonl
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.log
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.txt
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.swift
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.py
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.h
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.modulemap
            ${{ runner.temp }}/subtitle-result-lifetime/**/*.bin.gz
          retention-days: 14
